<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tyres Pressure</title>
<meta name="theme-color" content="#001533">
<meta name="description" content="Pressioni gomme, setup per turno e calcolatore per F4 Tatuus T-421 e BMW M4 GT4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700;1,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: muretto box in livrea team — fascia logo con barre inclinate, selezione, schede, vettura vista dall'alto.
   Unica veste scura (blu notte dei loghi), accento che cambia con il team: MPA azzurro/arancio, FS verde. */
:root{
  --bg:#001533; --surface:#07224a; --surface-2:#0d2d5c; --line:#1f4479;
  --fg:#f4f4f4; --muted:#9db3d3; --accent:#5bc4f1; --accent-2:#f2ad5c; --accent-ink:#001533;
  --ok:#3fd47c; --warn:#f2ad5c; --bad:#ff6b6b; --ok-bg:#0f3b2c; --warn-bg:#3b2f1b; --bad-bg:#3d1a24;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
body[data-team="fs"]{ --accent:#2ecf64; --accent-2:#ffffff; --accent-ink:#001533; }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
header{display:grid;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;min-height:56px}
.logo img{display:block;height:52px;width:auto;max-width:100%}
body[data-team="fs"] .logo img{height:64px}
.teamsw{display:flex;gap:4px}
.teamsw button{border:1px solid var(--line);background:transparent;color:var(--muted);font:italic 700 16px var(--f-display);letter-spacing:.06em;padding:6px 14px;cursor:pointer;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);min-height:36px}
.teamsw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.titlebar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:italic 800 34px/0.95 var(--f-display);letter-spacing:.01em;margin:0;text-transform:uppercase;text-wrap:balance}
h1 span{color:var(--accent)}
.stripes{display:flex;gap:6px;height:8px}
.stripes i{display:block;height:100%;transform:skewX(-28deg)}
.stripes i:nth-child(1){width:46px;background:var(--accent-2)}
.stripes i:nth-child(2){width:46px;background:var(--accent)}
.stripes i:nth-child(3){flex:1;background:var(--line)}
.sync{font-size:12px;color:var(--muted);font-family:var(--f-num)}
h2{font:italic 700 22px var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.sel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px;display:grid;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--bg);border-radius:4px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:0;background:transparent;color:var(--fg);font:600 14px var(--f-body);padding:8px 14px;cursor:pointer;min-height:38px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
select,input[type=text]{font:500 16px var(--f-num);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-height:40px;width:100%}
select{font-family:var(--f-body)}
input::placeholder{color:var(--muted);opacity:.8}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;color:var(--muted);font:italic 700 18px var(--f-display);text-transform:uppercase;letter-spacing:.04em;padding:8px 14px 10px;cursor:pointer;position:relative;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:4px;background:var(--accent);transform:skewX(-28deg)}
.panel{display:flex;flex-direction:column;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.car{display:grid;grid-template-columns:1fr 54px 1fr;grid-template-rows:auto auto;gap:10px;align-items:stretch}
.car .body{grid-column:2;grid-row:1/3;border:2px solid var(--line);border-radius:26px 26px 12px 12px;position:relative;background:linear-gradient(180deg,var(--surface-2),var(--surface))}
.car .body::before{content:"";position:absolute;left:0;right:0;margin-inline:auto;top:calc(10% + 4px);bottom:12%;width:4px;background:var(--accent);border-radius:2px}
.car .body::after{content:"";position:absolute;left:0;right:0;margin-inline:auto;top:10%;width:18px;height:18px;border-left:4px solid var(--accent);border-top:4px solid var(--accent);border-radius:2px 0 0 0;transform:rotate(45deg)}
.tyre{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tyre .t-h{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tyre .name{font:italic 700 16px var(--f-display);text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.big{font:600 32px/1 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big small{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}
.delta{font:500 12.5px var(--f-num);color:var(--muted)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini .field input{font-size:15px;min-height:36px;padding:6px 8px}
.chip{display:inline-block;font:600 11.5px var(--f-num);padding:2px 7px;border-radius:3px;background:var(--surface-2);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:9px 11px}
.note b{color:var(--fg)}
.btn{font:600 15px var(--f-body);border-radius:4px;padding:10px 18px;min-height:42px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);padding-inline:24px;border-radius:0}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.hist{display:flex;flex-direction:column;gap:8px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:grid;gap:6px}
.hcard .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;font:13px var(--f-num);font-variant-numeric:tabular-nums;width:100%}
th,td{padding:3px 6px;text-align:right;white-space:nowrap} th{color:var(--muted);font-weight:500;font-family:var(--f-body);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
td:first-child,th:first-child{text-align:left}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:10px 18px;font-weight:600;font-size:14px;z-index:20;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.muted{color:var(--muted)}
@media (max-width:420px){.car{grid-template-columns:1fr 22px 1fr}.car .body::after{width:10px;height:10px;border-width:3px}.car .body::before{top:calc(10% + 2px)}.big{font-size:27px}.logo img{height:40px}body[data-team="fs"] .logo img{height:52px}h1{font-size:29px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- modulo setup e calcolatore ---- */
:root{--chg:#f2ad5c;--chg-bg:#3b2f1b}
.mods{flex-wrap:nowrap}.mods button{font:italic 700 17px var(--f-display);text-transform:uppercase;letter-spacing:.04em;min-height:42px;padding-inline:8px;min-width:0}
@media (max-width:420px){.mods button{font-size:15px;letter-spacing:.02em}}
.schips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.schips button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--f-body);padding:8px 16px;cursor:pointer;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);min-height:40px;display:inline-flex;align-items:center;gap:6px}
.schips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.schips .cnt{font:600 11px var(--f-num);background:var(--chg);color:#001533;border-radius:3px;padding:0 5px}
.schips .add{color:var(--accent);border-style:dashed}
.shg{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:grid;gap:6px}
.shg h3{font:italic 700 17px var(--f-display);text-transform:uppercase;letter-spacing:.05em;margin:0;color:var(--accent)}
.srow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:start}
.srow.one{grid-template-columns:minmax(0,1.3fr) minmax(0,2fr)}
.slbl{font-size:13px;padding-top:9px;min-width:0}
.slbl .u{color:var(--muted);font-size:11px}
.scell{display:flex;flex-direction:column;gap:2px;min-width:0}
.scell input,.scell select{min-height:36px;padding:6px 8px;font-size:15px}
.scell.chg input,.scell.chg select{border-color:var(--chg);background:var(--chg-bg);font-weight:600}
.was{font:500 11px var(--f-num);color:var(--chg)}
.was:empty{display:none}
.chglist{background:var(--surface);border:1px solid var(--chg);border-radius:4px;padding:10px 12px}
.chglist .lbl{color:var(--chg)}
.chglist ul{margin:6px 0 0;padding-left:18px;display:grid;gap:3px;font-size:14px}
.chglist .to{color:var(--chg);font-weight:600}
.tech{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.tech>div{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-width:0}
.tv{font:600 14px var(--f-num);margin-top:2px;overflow-wrap:anywhere}
.tv .warn{color:var(--warn)}
.evhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
textarea{width:100%;font:15px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;resize:vertical}
table.cmp td{white-space:normal}
table.cmp tr.chg td{color:var(--chg);font-weight:600}
.cgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.cgrid .slbl{padding-top:0}
.ctiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ctile{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:grid;gap:4px;min-width:0}
.ctile .big{font-size:28px}
.note.warn{border-color:var(--warn);color:var(--warn)}
.convgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr) minmax(0,2fr);gap:8px;align-items:center}
.convgrid label{font-size:13px}
.cres{font:500 13px var(--f-num);color:var(--muted)} .cres b{color:var(--fg)}
@media (max-width:520px){.convgrid{grid-template-columns:1fr 1fr}.convgrid .cres{grid-column:1/-1;margin-bottom:6px}}

/* ---- layout schermo largo e scheda turno a vettura ---- */
.wrap{max-width:1760px}
.brand{flex-wrap:wrap}
.titlebar{order:3;flex-basis:100%}
.controls{display:grid;gap:12px}
.pwide,.cwide{display:grid;gap:14px}
.pin,.cin{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:900px){
  .titlebar{order:0;flex:1 1 auto;flex-basis:auto;justify-content:flex-start;gap:18px;align-items:baseline}
  .brand{flex-wrap:nowrap}
}
@media (min-width:1000px){
  .controls{grid-template-columns:minmax(380px,460px) 1fr;align-items:stretch}
  .mods{align-self:stretch}
  .sel{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;padding:10px 12px}
  .sel>.field{flex:0 1 auto}
  .sel>#trackWrap{flex:1 1 380px;flex-wrap:nowrap}
  .pwide{grid-template-columns:minmax(320px,1fr) minmax(0,1.5fr);align-items:start}
  .cwide{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
}
/* scheda turno */
.evbar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.evtitle{display:flex;flex-direction:column;min-width:0}
.evbar .schips{flex:1 1 300px;min-width:0}
.sesbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.sesact{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.chglist{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
.chglist .lbl{flex-basis:100%}
.chgi{font-size:13.5px}
.sheet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.col-l,.col-r,.col-c{display:flex;flex-direction:column;gap:12px;min-width:0}
.col-c{grid-column:1/-1;order:-1}
@media (min-width:1180px){ .sheet{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr)} .col-c{grid-column:auto;order:0} }
.corner,.axle,.gen{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:grid;gap:6px;min-width:0}
.corner h3,.axle h3,.gen h3{display:flex;align-items:center;gap:8px;margin:0 0 2px;font:italic 700 17px var(--f-display);text-transform:uppercase;letter-spacing:.05em;color:var(--fg)}
.corner h3 span{font-style:normal;font:700 13px var(--f-num);background:var(--accent);color:var(--accent-ink);padding:1px 7px;border-radius:3px;letter-spacing:.04em}
.axle h3,.gen h3{color:var(--accent)}
.ncnt{margin-left:auto;font:600 12px var(--f-num);font-style:normal;background:var(--chg);color:#001533;padding:1px 7px;border-radius:3px}
.fx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:8px;align-items:center;min-width:0}
.fl{font-size:13px;color:var(--fg)} .fl .u{color:var(--muted);font-size:11px}
.fi{display:flex;flex-direction:column;gap:2px;min-width:0}
.fi input,.fi select{min-height:34px;padding:5px 8px;font-size:15px}
.fx.chg .fi input,.fx.chg .fi select{border-color:var(--chg);background:var(--chg-bg);font-weight:600}
.fx.chg .fl{color:var(--chg)}
.axgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.axgrid .fx,.ggrid .fx{grid-template-columns:1fr;gap:3px}
.ggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.axinfo{font:500 12px var(--f-num);color:var(--muted)}
.gens{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.gen.notes textarea{min-height:120px}
.gens.top{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));align-items:start}
.gen h3 .u{color:var(--muted);font:500 11px var(--f-body);text-transform:none;letter-spacing:0}
@media (max-width:699px){ .fx{grid-template-columns:1fr;gap:3px} .corner{padding:8px} .corner h3{font-size:15px} }
/* vettura */
.viz{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px;display:grid;gap:10px}
.vtop svg{display:block;width:100%;max-width:420px;max-height:600px;margin:0 auto}
.vstrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.vstrip figure{margin:0;background:var(--bg);border-radius:4px;padding:6px 6px 2px;min-width:0}
.vstrip svg{display:block;width:100%}
figcaption{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
@media (min-width:700px){ .viz{grid-template-columns:minmax(0,1fr) minmax(0,.95fr);align-items:center} .vstrip{grid-template-columns:1fr} .vleg{grid-column:1/-1} }
@media (max-width:699px){ .vstrip{grid-template-columns:1fr 1fr} .vstrip figure:first-child{grid-column:1/-1} .vtop svg{max-height:440px} }
.viz .s1{stop-color:var(--surface-2)} .viz .s2{stop-color:var(--accent);stop-opacity:.45}
.viz .body{stroke:var(--accent);stroke-width:1.5}
.v-end .body,.v-side .body{fill:var(--surface-2)}
.viz .body.chg{stroke:var(--chg)}
.viz .pods{fill:var(--surface-2);stroke:var(--line)}
.viz .cockpit{fill:var(--bg);stroke:var(--line)}
.viz .halo{fill:none;stroke:var(--muted);stroke-width:3;stroke-linecap:round}
.viz .wingp{fill:var(--accent-2)}
.viz .arms path,.viz .arms2{stroke:var(--muted);stroke-width:2;fill:none}
.viz .whl{fill:#0a0e14;stroke:var(--muted);stroke-width:1.5;transform-box:fill-box;transform-origin:center;transition:transform .45s cubic-bezier(.3,.7,.2,1),stroke .2s}
.viz .whl line{stroke:#26364c}
.viz .whl.chg{stroke:var(--chg);stroke-width:2.5}
.viz .whl.e,.viz .ghost.e{transform-origin:center bottom}
.viz .ghost{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3;opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .3s,transform .45s}
.viz .ground{stroke:var(--line);stroke-width:2}
.viz .dim{stroke:var(--accent);stroke-width:2;stroke-dasharray:3 2}
.viz .ebody{transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.viz .floor{fill:var(--accent)} .viz .ebody.chg .floor{fill:var(--chg)}
.v-side .body,.v-side .ghost{transition:d .45s cubic-bezier(.3,.7,.2,1),opacity .3s}
.v-side .ghost{transform:none}
.viz .hub{fill:#26364c}
#sFW,#sRW{transition:transform .45s cubic-bezier(.3,.7,.2,1)}
#sFW.chg .wingp,#sRW.chg .wingp{fill:var(--chg)}
.viz .vt{font:600 11px var(--f-num);fill:var(--muted)}
.viz .vt.big{font-size:12px;fill:var(--fg)}
.viz .vt .chg,.viz .vt.chg{fill:var(--chg)}
.vleg{font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lg{display:inline-block;width:18px;border-top:2px solid var(--accent)} .lg.prv{border-top:2px dashed var(--muted);margin-left:8px}
.viz .tap{cursor:pointer}
.viz .lv-blue{fill:#1f4fd8} .viz .lv-dark{fill:#123aa8} .viz .lv-sky{fill:#5bc8f5} .viz .lv-orange{fill:#f2701d}
.viz .lv-black{fill:#101214} .viz .lv-white{fill:#f2f3f5} .viz .lv-red{fill:#e0242b}
.viz .lv-halo{fill:none;stroke:#101214;stroke-width:5;stroke-linecap:round} .viz .lv-strut{fill:none;stroke:#101214;stroke-width:3}
.viz .lv-helmet{fill:#f2f3f5;stroke:#101214;stroke-width:1}
.viz .lv-logo{fill:#fff;font-family:var(--f-display);font-weight:800;font-style:italic;letter-spacing:.02em}
.viz .tyre{fill:#121417;stroke:#2b3038;stroke-width:1.2}
.viz .pz{fill:none;stroke:#f5c400;stroke-width:1.4}
.viz .rim{fill:#c9ced6;stroke:#868c95} .viz .spk{stroke:#5d636b;stroke-width:2.4} .viz .hubc{fill:#2e3238}
.viz .wout{fill:none;stroke:transparent;stroke-width:5} .viz .whl.chg .wout{stroke:var(--chg)}
.viz .whl.e.chg{stroke:var(--chg);stroke-width:2.5}
.viz .hit{fill:transparent}
.viz .sgrp{transition:transform .45s cubic-bezier(.3,.7,.2,1)} #sGhost{opacity:0;transition:opacity .3s,transform .45s}
#sGhost .ghost{opacity:1;transform:none}
#sFW.chg .lv-black,#sRW.chg .lv-black{fill:var(--chg)}
.v-top .vt{font-size:30px} .v-top .vt.big{font-size:28px}
.v-top .ghost{stroke-width:3}
.viz .tap:hover{filter:brightness(1.25)}

.corner.flash,.axle.flash{animation:flash 1s ease}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--accent)}100%{box-shadow:0 0 0 2px transparent}}
@media (prefers-reduced-motion:reduce){.viz *{transition:none!important}}
/* vettura stilizzata F4 */
.viz .wingp2{fill:var(--accent-2);fill-opacity:.7}
.viz .floor2{fill:#0a1a33;stroke:var(--line);stroke-width:1}
.viz .stripe{fill:none;stroke:var(--accent);stroke-width:2;stroke-opacity:.8}
.viz .airbox{fill:var(--surface-2);stroke:var(--accent);stroke-width:1.2}
.viz .light{fill:#e0242b}
.viz .rimc{fill:#2a3a52;stroke:var(--muted);stroke-width:1}
.viz .spk{stroke:var(--muted);stroke-width:1.6}
.v-side .halo,.v-end .halo{fill:none;stroke:var(--muted);stroke-width:3;stroke-linecap:round}
#sPod,#sHalo,#sFEP,#sREP{transition:d .45s cubic-bezier(.3,.7,.2,1)}
#sFW.chg .wingp2,#sRW.chg .wingp2{fill:var(--chg);fill-opacity:1}
.v-top .vt{font-size:11px} .v-top .vt.big{font-size:12px}
.viz .susp{fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;transition:d .45s}
</style>

        <div class="row" style="flex-wrap:nowrap"><input type="text" id="newTrack" placeholder="Nome pista" style="font-family:var(--f-body)"><button class="btn sm" id="addTrack" type="button">Aggiungi</button></div></div>
    </div>
    <div class="field" id="condWrap"><div class="lbl">Condizione pista</div><div class="seg" id="condSeg"></div></div>
  </section>
  </div>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const P0 = 1.013; // bar, pressione atmosferica
const C = ['AS','AD','PS','PD'];
const CN = {AS:'Ant. Sx',AD:'Ant. Dx',PS:'Post. Sx',PD:'Post. Dx'};
const CARS = {
  f4:  {name:'F4 Tatuus T-421', air:true,  def:{cold:[1.05,1.05,1.10,1.10], target:[1.40,1.40,1.43,1.43]}},
  gt4: {name:'BMW M4 GT4',      air:false, def:{cold:[1.45,1.45,1.40,1.40], target:[1.85,1.85,1.85,1.85]}}
};
// Base 20/20 dal foglio "TYRE PRESSURE" (MPA, Mugello)
// GT: dal foglio "TYRES PRESSURE" (GT Cup Europe, Barcellona)
const SEED_BASES = {
  'f4|Mugello':      {cold:[1.03,1.09,1.08,1.11], target:[1.40,1.40,1.43,1.43]},
  'gt4|Monza':       {cold:[1.28,1.38,1.21,1.28], target:[1.85,1.85,1.85,1.85]},
  'gt4|Spa-Francorchamps': {cold:[1.29,1.33,1.24,1.30], target:[1.85,1.85,1.85,1.85]},
  'gt4|Misano':      {cold:[1.25,1.29,1.18,1.24], target:[1.85,1.85,1.85,1.85]},
  'gt4|Paul Ricard': {cold:[1.30,1.36,1.21,1.31], target:[1.85,1.85,1.85,1.85]},
  'gt4|Barcellona':  {cold:[1.24,1.30,1.21,1.29], target:[1.85,1.85,1.85,1.85]}
};
// Coefficienti dai fogli: bar ogni +10 °C; rapporto caldo/freddo 1,5 F4, 2 GT
const DEF_COEF = {
  f4:  {kEnv:-0.0595, kRim:0.0595, ratio:1.5, mem:'avg3'},
  gt4: {kEnv:-0.05,   kRim:0.07,   ratio:2,   mem:'avg3'}
};
const CONDS = {dry:'Asciutta', damp:'Umida', wet:'Bagnata'};
const DEF_TRACKS = ['Monza','Imola','Mugello','Misano','Vallelunga','Paul Ricard','Spa-Francorchamps','Red Bull Ring','Barcellona','Hockenheim','Nürburgring','Zandvoort','Hungaroring'];
const TABS = {calc:'Calcolo', reg:'Registra run', hist:'Storico', base:'Base pista'};

let S = {
  car:'f4', track:'Mugello', cond:'dry', tab:'calc',
  sessions:[], bases:{}, prefs:{tracks:[], coef:{}},
  inp:{tt:20, ta:20, trim:[20,20,20,20], target:null},
  mode:'local', col:null
};

/* ---------- utilità ---------- */
const $ = s => document.querySelector(s);
const num = v => { const n = parseFloat(String(v).replace(',','.')); return isFinite(n) ? n : NaN; };
const f2 = n => isFinite(n) ? n.toFixed(2) : '–';
const f1 = n => isFinite(n) ? n.toFixed(1) : '–';
const sgn = n => (n>0?'+':'') + f2(n);
const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2200); }
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
const tracks = () => [...new Set([...DEF_TRACKS, ...(S.prefs.tracks||[])])];
const baseKey = (car,track) => 'base_'+car+'_'+slug(track);
function getBase(car=S.car, track=S.track){
  return S.bases[baseKey(car,track)] || (SEED_BASES[car+'|'+track] ? {...SEED_BASES[car+'|'+track], isSeed:true} : {...CARS[car].def, isDefault:true});
}
const coef = (car=S.car) => ({...DEF_COEF[car], ...((S.prefs.coef||{})[car]||{})});
const tol = d => Math.abs(d)<=0.02 ? 'ok' : Math.abs(d)<=0.05 ? 'warn' : 'bad';

/* ---------- modello (dal foglio TYRE PRESSURE) ----------
   Freddo = Base20/20 + (Tamb − 20)·kEnv/10 + (Tcerchio − 20)·kRim/10 − (TargetBase − NuovoTarget)/rapporto
   Tamb = media (T aria + T pista) per la F4, T pista per la GT4.
   Dopo un run: Freddo corretto = Freddo messo − (Caldo − Target)/rapporto,
   riportato a 20/20 e al target base: diventa la nuova Base 20/20 per quella pista e condizione.
*/
function history(car=S.car, track=S.track, cond=S.cond){
  return S.sessions.filter(s=>s.car===car && s.track===track && s.cond===cond).sort((a,b)=>b.date-a.date);
}
const tenvOf = (car,tt,ta) => CARS[car].air ? (tt+ta)/2 : tt;
const envCorr = (k,tenv,trim) => (tenv-20)*k.kEnv/10 + (trim-20)*k.kRim/10;

// Base 20/20 ricavata da un run, espressa al target base
function base20FromRun(s,i,b,k){
  const corrected = s.cold[i] - (s.hot[i]-s.target[i])/k.ratio;
  return corrected - envCorr(k, tenvOf(s.car,s.tt,s.ta??s.tt), s.trim[i]) + (b.target[i]-s.target[i])/k.ratio;
}
function learnedBase(){
  const b=getBase(), k=coef(), h=history().slice(0, k.mem==='last'?1:3);
  if(!h.length) return null;
  const w=[0.6,0.3,0.1].slice(0,h.length), sw=w.reduce((a,x)=>a+x,0);
  return {cold: C.map((_,i)=> h.reduce((a,s,j)=>a+w[j]*base20FromRun(s,i,b,k),0)/sw), n:h.length};
}
function recommend(){
  const b=getBase(), k=coef(), I=S.inp, L=learnedBase();
  const target = I.target || b.target;
  const tenv = tenvOf(S.car, I.tt, I.ta);
  return C.map((_,i)=>{
    const base20 = L ? L.cold[i] : b.cold[i];
    const cold = base20 + envCorr(k, tenv, I.trim[i]) - (b.target[i]-target[i])/k.ratio;
    return {cold, base:b.cold[i], base20, target:target[i], src:L?L.n:0};
  }).concat([{n:L?L.n:0, tenv}]);
}

/* ---------- persistenza ---------- */
function setSync(t){ $('#sync').textContent=t; }
async function persist(id, data){
  if(S.mode==='cloud'){
    try{ await S.col.doc(id).set(data); return true; }
    catch(e){ toast('Salvataggio non riuscito: '+(e.code||'errore')); return false; }
  }
  const all = lsGet('pg_docs',{}); all[id]=data; lsSet('pg_docs',all); ingest(all); return true;
}
async function remove(id){
  if(S.mode==='cloud'){ try{ await S.col.doc(id).delete(); }catch(e){ toast('Eliminazione non riuscita'); } return; }
  const all=lsGet('pg_docs',{}); delete all[id]; lsSet('pg_docs',all); ingest(all);
}
function stable(v){ if(Array.isArray(v)) return '['+v.map(stable).join(',')+']'; if(v&&typeof v==='object') return '{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}'; return JSON.stringify(v??null); }
function ingest(docs){
  const ses=[], bases={}, events={}; let prefs=null;
  Object.entries(docs).forEach(([id,d])=>{
    if(!d) return;
    if(d.kind==='session') ses.push({...d, id});
    else if(d.kind==='base') bases[id]=d;
    else if(d.kind==='event'){ const {kind,...e}=d; events[id]={...e, id}; }
    else if(id==='prefs') prefs=d;
  });
  ses.sort((a,b)=>a.id<b.id?-1:1);
  if(typeof evDirty==='function' && S.events){ Object.keys(S.events).forEach(id=>{ if(evDirty(id)) events[id]=S.events[id]; }); Object.keys(events).forEach(id=>{ if(!S.events[id] && evDirty(id)) delete events[id]; }); }
  const nextPrefs = prefs ? {...S.prefs, ...prefs} : S.prefs;
  const sig = x => stable({s:[...x.s].sort((a,b)=>a.id<b.id?-1:1), b:x.b, e:x.e, p:(({kind,...r})=>r)(x.p||{})});
  // salta il ridisegno se arriva solo l'eco di un nostro salvataggio (non perdi il campo in cui scrivi)
  if(S._loaded && sig({s:ses,b:bases,e:events,p:nextPrefs})===sig({s:S.sessions,b:S.bases,e:S.events||{},p:S.prefs})) return;
  S._loaded=true;
  S.sessions=ses; S.bases=bases; S.events=events; S.prefs=nextPrefs;
  if(S.evId && !events[S.evId]) S.evId=null;
  if(!S.evId){ const l=Object.values(events).filter(e=>e.car==='f4').sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.created-a.created); if(l[0]) S.evId=l[0].id; }
  render();
}
async function initStore(){
  const use = window.claude && window.claude.use;
  let db=null, uid=null;
  if(use){ try{ const [u,d] = await Promise.all([use('user'), use('db')]); db=d; uid = u ? await u.id() : null; }catch(e){} }
  if(db && uid){
    S.mode='cloud'; S.col=db.collection('data/users/'+uid);
    setSync('Caricamento dati…');
    const timer=setTimeout(()=>setSync('Dati non ancora raggiungibili'),10000);
    S.col.onSnapshot(snap=>{
      if(!snap.metadata.fromCache){ clearTimeout(timer); setSync('Salvato nel tuo account'); }
      const docs={}; snap.docs.forEach(d=>docs[d.id]=d.data()); ingest(docs);
    }, e=>{ clearTimeout(timer); setSync('Archivio non disponibile'); });
  } else {
    S.mode='local'; setSync('Salvato su questo dispositivo'); ingest(lsGet('pg_docs',{}));
  }
}

/* ---------- interfaccia ---------- */
function renderSel(){
  $('#carSeg').innerHTML = Object.entries(CARS).map(([k,c])=>`<button type="button" data-car="${k}" aria-pressed="${S.car===k}">${c.name}</button>`).join('');
  $('#condSeg').innerHTML = Object.entries(CONDS).map(([k,c])=>`<button type="button" data-cond="${k}" aria-pressed="${S.cond===k}">${c}</button>`).join('');
  $('#trackSel').innerHTML = tracks().map(t=>`<option ${t===S.track?'selected':''}>${esc(t)}</option>`).join('');
  $('#modSeg').innerHTML = [['press','Pressioni'],['setup','Setup'],['calc','Calcolatore']].map(([k,t])=>`<button type="button" data-mod="${k}" aria-pressed="${S.mod===k}">${t}</button>`).join('');
  $('#condWrap').hidden = S.mod!=='press'; $('#trackWrap').hidden = S.mod!=='press';
  if(S.mod==='press') $('#tabs').innerHTML = Object.entries(TABS).map(([k,t])=>`<button type="button" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${t}</button>`).join('');
  else { const T=S.mod==='setup'?SET_TABS:CALC_TABS, cur=S.stab[S.mod]; $('#tabs').innerHTML = (S.car==='f4'?Object.entries(T):[]).map(([k,t])=>`<button type="button" role="tab" data-stab="${k}" aria-selected="${cur===k}">${t}</button>`).join(''); }
}
const inp = (id,val,extra='') => `<input type="text" inputmode="decimal" id="${id}" value="${isFinite(val)?val:''}" ${extra}>`;

function condInputs(prefix, I, air){
  return `<div class="grid3">
    <div class="field"><label class="lbl" for="${prefix}tt">T pista °C</label>${inp(prefix+'tt',I.tt)}</div>
    ${air?`<div class="field"><label class="lbl" for="${prefix}ta">T aria °C</label>${inp(prefix+'ta',I.ta)}</div>`:''}
    <div class="field"><label class="lbl" for="${prefix}trimAll">T cerchio freddo °C (tutte)</label>${inp(prefix+'trimAll','', 'placeholder="imposta 4"')}</div>
  </div>`;
}

function renderCalc(){
  const car=CARS[S.car], b=getBase(), I=S.inp; if(!I.target) I.target=[...b.target];
  const r=recommend(), meta=r.pop();
  const tyres = C.map((c,i)=>{
    const x=r[i], d=x.cold-x.base;
    return `<div class="tyre" style="grid-column:${i%2?3:1};grid-row:${i<2?1:2}">
      <div class="t-h"><span class="name">${CN[c]}</span><span class="chip">${x.src?x.src+' run':'base'}</span></div>
      <div class="big" id="out${i}">${f2(x.cold)}<small>bar</small></div>
      <div class="delta" id="dl${i}">base 20/20 ${f2(x.base20)}${x.src?` (pista ${f2(x.base)})`:''}</div>
      <div class="mini">
        <div class="field" style="grid-column:1/-1"><label class="lbl" for="trim${i}">Cerchio °C</label>${inp('trim'+i,I.trim[i])}</div>
      </div></div>`;
  }).join('');
  const k=coef();
  const amb = `${car.air?'media aria+pista':'T pista'} <span id="ambTxt">${f1(meta.tenv)}</span> °C`;
  const info = (meta.n
    ? `Base 20/20 aggiornata da ${meta.n===1?'l\'ultimo run':'una media pesata degli ultimi '+meta.n+' run'} su ${esc(S.track)} (${CONDS[S.cond].toLowerCase()}).`
    : `Nessun run registrato su ${esc(S.track)} in condizione ${CONDS[S.cond].toLowerCase()}: parto dalla Base 20/20 della pista.`)
    + ` Correzione per ${amb} (${sgn(k.kEnv)} bar/10 °C) e T cerchio (${sgn(k.kRim)} bar/10 °C), rapporto caldo/freddo ${f2(k.ratio)}.`;
  return `<div class="panel">
    <h2>Pressioni a freddo consigliate</h2>
    ${b.isDefault?`<div class="note">La base di ${esc(S.track)} usa valori di esempio. Inserisci i tuoi nella scheda <b>Base pista</b>.</div>`:''}
    ${b.isSeed?`<div class="note">Base 20/20 di ${esc(S.track)} presa dal tuo file ${S.car==='f4'?'MPA':'GT'}: target ${f2(b.target[0])} ant. / ${f2(b.target[2])} post.</div>`:''}
    <div class="pwide"><div class="pin">
    ${condInputs('c', I, car.air)}
    <div class="grid3">
    <div class="field"><label class="lbl" for="cTgF">Target caldo anteriore</label>${inp('cTgF',I.target[0])}</div>
    <div class="field"><label class="lbl" for="cTgR">Target caldo posteriore</label>${inp('cTgR',I.target[2])}</div>
    </div>
    <div class="note" id="calcInfo">${info}</div>
    <div class="row"><button class="btn primary" type="button" id="toReg">Copia valori nel Run</button>
    <button class="btn" type="button" id="toBase">Aggiorna Base 20/20 dai run</button></div>
    </div><div class="car">${tyres}<div class="body" aria-hidden="true"></div></div></div>
  </div>`;
}
function updateCalcOutputs(){
  const r=recommend(), m=r.pop(); const a=$('#ambTxt'); if(a) a.textContent=f1(m.tenv);
  r.forEach((x,i)=>{ const o=$('#out'+i), d=$('#dl'+i); if(o){ o.innerHTML=`${f2(x.cold)}<small>bar</small>`; d.textContent=`base 20/20 ${f2(x.base20)}${x.src?` (pista ${f2(x.base)})`:''}`; } });}

let draft=null;
function renderReg(){
  const car=CARS[S.car];
  if(!draft || draft.car!==S.car || !draft.edited){
    const r=recommend(); r.pop();
    draft={car:S.car, tt:S.inp.tt, ta:S.inp.ta, trim:[...S.inp.trim], cold:r.map(x=>+x.cold.toFixed(2)), hot:[NaN,NaN,NaN,NaN], target:[...(S.inp.target||getBase().target)], note:''};
  }
  const D=draft;
  const tyres=C.map((c,i)=>`<div class="tyre" style="grid-column:${i%2?3:1};grid-row:${i<2?1:2}">
      <div class="t-h"><span class="name">${CN[c]}</span><span class="chip" id="er${i}">target ${f2(D.target[i])}</span></div>
      <div class="mini">
        <div class="field"><label class="lbl" for="rc${i}">Freddo bar</label>${inp('rc'+i,D.cold[i])}</div>
        <div class="field"><label class="lbl" for="rh${i}">Caldo bar</label>${inp('rh'+i,D.hot[i],'placeholder="misurato"')}</div>
        <div class="field" style="grid-column:1/-1"><label class="lbl" for="rt${i}">Cerchio °C</label>${inp('rt'+i,D.trim[i])}</div>
      </div></div>`).join('');
  return `<div class="panel">
    <h2>Registra run</h2>
    <div class="note">${esc(car.name)} · ${esc(S.track)} · ${CONDS[S.cond]}. Inserisci le pressioni a caldo misurate: il prossimo calcolo si correggerà da solo.</div>
    <div class="pwide"><div class="pin">
    <div class="grid3">
      <div class="field"><label class="lbl" for="rtt">T pista °C</label>${inp('rtt',D.tt)}</div>
      ${car.air?`<div class="field"><label class="lbl" for="rta">T aria °C</label>${inp('rta',D.ta)}</div>`:''}
      <div class="field"><label class="lbl" for="rTgF">Target caldo anteriore</label>${inp('rTgF',D.target[0])}</div>
    <div class="field"><label class="lbl" for="rTgR">Target caldo posteriore</label>${inp('rTgR',D.target[2])}</div>
      <div class="field"><label class="lbl" for="rnote">Note</label><input type="text" id="rnote" value="${esc(D.note)}" placeholder="FP1, gomme nuove…" style="font-family:var(--f-body)"></div>
    </div>
    <div class="row"><button class="btn primary" type="button" id="saveRun">Salva run</button><button class="btn" type="button" id="resetRun">Ricarica dai consigliati</button></div>
    </div><div class="car">${tyres}<div class="body" aria-hidden="true"></div></div></div>
  </div>`;
}
function updateRegChips(){
  C.forEach((_,i)=>{ const el=$('#er'+i); if(!el) return; const h=draft.hot[i], t=draft.target[i];
    if(isFinite(h)){ const d=h-t; el.className='chip '+tol(d); el.textContent=`${sgn(d)} vs ${f2(t)}`; } else { el.className='chip'; el.textContent=`target ${f2(t)}`; } });
}

function renderHist(){
  const car=CARS[S.car];
  const all=S.sessions.filter(s=>s.car===S.car && s.track===S.track).sort((a,b)=>b.date-a.date);
  if(!all.length) return `<div class="panel"><h2>Storico</h2><div class="note">Nessun run salvato per ${esc(car.name)} a ${esc(S.track)}. Registra il primo dalla scheda <b>Registra run</b>.</div></div>`;
  return `<div class="panel"><h2>Storico · ${esc(S.track)}</h2><div class="hist">${all.map(s=>{
    const dt=new Date(s.date);
    return `<div class="hcard"><div class="top"><div><b>${dt.toLocaleDateString('it-IT')} ${dt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}</b> <span class="chip">${CONDS[s.cond]}</span> <span class="muted">${esc(s.note||'')}</span></div>
      <button class="btn sm danger" type="button" data-del="${s.id}">Elimina</button></div>
      <div class="muted" style="font-size:13px">T pista ${f1(s.tt)}°C${car.air?` · T aria ${f1(s.ta)}°C`:''}</div>
      <div class="tbl-wrap"><table><thead><tr><th></th>${C.map(c=>`<th>${CN[c]}</th>`).join('')}</tr></thead><tbody>
        <tr><td>Cerchio °C</td>${s.trim.map(v=>`<td>${f1(v)}</td>`).join('')}</tr>
        <tr><td>Freddo</td>${s.cold.map(v=>`<td>${f2(v)}</td>`).join('')}</tr>
        <tr><td>Caldo</td>${s.hot.map(v=>`<td>${f2(v)}</td>`).join('')}</tr>
        <tr><td>Scarto</td>${s.hot.map((v,i)=>{const d=v-s.target[i]; return `<td><span class="chip ${tol(d)}">${sgn(d)}</span></td>`;}).join('')}</tr>
      </tbody></table></div></div>`;}).join('')}</div></div>`;
}

function renderBase(){
  const car=CARS[S.car], b=getBase(), k=coef();
  return `<div class="panel"><h2>Base 20/20 · ${esc(S.track)}</h2>
    <div class="note">Pressioni a freddo con cerchio a 20 °C e ${car.air?'media aria+pista':'T pista'} a 20 °C che danno il target a caldo. Vale finché non registri run per la condizione scelta: da lì la base si aggiorna da sola.</div>
    <div class="tbl-wrap"><table><thead><tr><th></th>${C.map(c=>`<th>${CN[c]}</th>`).join('')}</tr></thead><tbody>
      <tr><td>Base 20/20 bar</td>${C.map((_,i)=>`<td>${inp('bc'+i,b.cold[i],'style="width:78px"')}</td>`).join('')}</tr>
    </tbody></table></div>
    <div class="grid3">
    <div class="field"><label class="lbl" for="bTgF">Target caldo anteriore</label>${inp('bTgF',b.target[0])}</div>
    <div class="field"><label class="lbl" for="bTgR">Target caldo posteriore</label>${inp('bTgR',b.target[2])}</div>
    </div>
    <div class="row"><button class="btn primary" type="button" id="saveBase">Salva base</button></div>
    <h2 style="margin-top:8px">Coefficienti · ${esc(car.name)}</h2>
    <div class="note">Valori di partenza dai tuoi fogli: ${sgn(DEF_COEF[S.car].kEnv)} bar ogni +10 °C di ${car.air?'media aria+pista':'T pista'}, ${sgn(DEF_COEF[S.car].kRim)} bar ogni +10 °C di cerchio, rapporto caldo/freddo ${f2(DEF_COEF[S.car].ratio)}.</div>
    <div class="grid3">
      <div class="field"><label class="lbl" for="kEnv">${car.air?'Aria+pista':'T pista'} bar/10 °C</label>${inp('kEnv',k.kEnv)}</div>
      <div class="field"><label class="lbl" for="kRim">Cerchio bar/10 °C</label>${inp('kRim',k.kRim)}</div>
      <div class="field"><label class="lbl" for="kRatio">Rapporto caldo/freddo</label>${inp('kRatio',k.ratio)}</div>
    </div>
    <div class="field"><div class="lbl">Aggiornamento base dai run</div><div class="seg" id="memSeg">

function render(){
  renderSel();
  if(S.mod==='setup'){ $('#view').innerHTML=renderSetup(); const ev=curEvent(), ses=ev&&curSession(ev); if(ses && document.querySelector('.viz')){ const pv=prevSession(ev,ses); updateViz(ses.setup, pv?pv.setup:null); } return; }
  if(S.mod==='calc'){ $('#view').innerHTML=renderCalcMod(); if(S.car==='f4'&&S.stab.calc==='conv') updateConv(); return; }
  const v = {calc:renderCalc, reg:renderReg, hist:renderHist, base:renderBase}[S.tab]();
  $('#view').innerHTML=v;
  if(S.tab==='reg') updateRegChips();
}

/* ---------- eventi ---------- */
document.addEventListener('click', async e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.car){ S.car=t.dataset.car; S.inp.target=null; draft=null; render(); }
  else if(t.dataset.cond){ S.cond=t.dataset.cond; draft=null; render(); }
  else if(t.dataset.tab){ S.tab=t.dataset.tab; render(); }
  else if(t.id==='addTrack'){ const n=$('#newTrack').value.trim(); if(!n) return;
    if(!tracks().includes(n)){ S.prefs.tracks=[...(S.prefs.tracks||[]),n]; await persist('prefs',{...S.prefs, kind:'prefs'}); }
    S.track=n; S.inp.target=null; draft=null; render(); toast('Pista aggiunta'); }
  else if(t.id==='toReg'){ draft=null; S.tab='reg'; render(); window.scrollTo({top:0}); toast('Valori copiati: inserisci le pressioni a caldo'); }
  else if(t.id==='toBase'){ const L=learnedBase(); const b=getBase();
    if(!L){ toast('Registra almeno un run per aggiornare la base'); return; }
    const nb={kind:'base', car:S.car, track:S.track, cold:L.cold.map(v=>+v.toFixed(3)), target:[...b.target]};
    if(await persist(baseKey(S.car,S.track), nb)) toast('Base 20/20 aggiornata'); }
  else if(t.dataset.mem){ document.querySelectorAll('#memSeg button').forEach(x=>x.setAttribute('aria-pressed', x===t)); }
  else if(t.id==='resetRun'){ draft=null; render(); }
  else if(t.id==='saveRun'){
    const D=draft;
    const bad = [...D.cold,...D.hot,...D.trim,...D.target,D.tt].some(v=>!isFinite(v)) || (CARS[S.car].air && !isFinite(D.ta));
    if(bad){ toast('Compila tutti i valori, incluse le pressioni a caldo'); return; }
    const id='s_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const ok=await persist(id,{kind:'session', car:S.car, track:S.track, cond:S.cond, date:Date.now(), tt:D.tt, ta:CARS[S.car].air?D.ta:null, trim:D.trim, cold:D.cold, hot:D.hot, target:D.target, note:D.note});
    if(ok){ toast('Run salvato'); draft=null; S.inp.tt=D.tt; S.inp.ta=D.ta; S.tab='calc'; render(); }
  }
  else if(t.dataset.del){ if(t.dataset.armed){ await remove(t.dataset.del); toast('Run eliminato'); } else { t.dataset.armed='1'; t.textContent='Conferma'; } }
  else if(t.id==='saveBase'){
    const g=id=>num($('#'+id)?.value);
    const nb={kind:'base', car:S.car, track:S.track, cold:C.map((_,i)=>g('bc'+i)), target:[g('bTgF'),g('bTgF'),g('bTgR'),g('bTgR')]};
    if([...nb.cold,...nb.target].some(v=>!isFinite(v))){ toast('Controlla i valori: alcuni campi sono vuoti'); return; }
    if(await persist(baseKey(S.car,S.track),nb)){ S.inp.target=[...nb.target]; toast('Base salvata'); }
  }
  else if(t.id==='savePrefs'){
    const kEnv=num($('#kEnv').value), kRim=num($('#kRim').value), ratio=num($('#kRatio').value);
    const mem=document.querySelector('#memSeg button[aria-pressed="true"]')?.dataset.mem||'avg3';
    if(![kEnv,kRim,ratio].every(isFinite) || ratio<=0){ toast('Inserisci numeri validi; il rapporto deve essere maggiore di 0'); return; }
    S.prefs.coef={...(S.prefs.coef||{}), [S.car]:{kEnv,kRim,ratio,mem}};
    await persist('prefs',{...S.prefs, kind:'prefs'}); toast('Coefficienti salvati'); render(); }
});
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;

document.addEventListener('input', e=>{
  if(S.mod!=='press') return;
  const id=e.target.id, v=num(e.target.value);
  if(S.tab==='calc'){
    if(id==='ctt') S.inp.tt=v; else if(id==='cta') S.inp.ta=v;
    else if(id==='ctrimAll'){ if(isFinite(v)){ S.inp.trim=[v,v,v,v]; C.forEach((_,i)=>{$('#trim'+i).value=v;}); } }
    else if(/^trim\d$/.test(id)) S.inp.trim[+id[4]]=v;
    else if(id==='cTgF'){ S.inp.target[0]=S.inp.target[1]=v; }
    else if(id==='cTgR'){ S.inp.target[2]=S.inp.target[3]=v; }
    else return;
    updateCalcOutputs();
  } else if(S.tab==='reg' && draft){
    draft.edited=true;
    if(id==='rtt') draft.tt=v; else if(id==='rta') draft.ta=v; else if(id==='rnote') draft.note=e.target.value;
    else if(id==='rTgF'){ draft.target[0]=draft.target[1]=v; }
    else if(id==='rTgR'){ draft.target[2]=draft.target[3]=v; }
    else if(/^r[cht]\d$/.test(id)){ const k={c:'cold',h:'hot',t:'trim',g:'target'}[id[1]]; draft[k][+id[2]]=v; }
    updateRegChips();
  }
});
$('#trackSel').addEventListener('change', e=>{ S.track=e.target.value; S.inp.target=null; draft=null; render(); });

/* ---------- calcoli tecnici ---------- */
function interpRH(tab, rrh, frh){
  const R=AERO.rrh, F=AERO.frh; let out=false;
  let r=rrh, f=frh;
  if(r>R[0]){r=R[0];out=true;} if(r<R[R.length-1]){r=R[R.length-1];out=true;}
  if(f<F[0]){f=F[0];out=true;} if(f>F[F.length-1]){f=F[F.length-1];out=true;}
  let i=0; while(i<R.length-2 && r<R[i+1]) i++;
  let j=0; while(j<F.length-2 && f>F[j+1]) j++;
  const tr=(R[i]-r)/(R[i]-R[i+1]), tf=(f-F[j])/(F[j+1]-F[j]);
  const q=[tab[i][j],tab[i][j+1],tab[i+1][j],tab[i+1][j+1]];
  if(q.some(v=>v==null)){ out=true; const ok=q.filter(v=>v!=null); return {v: ok.length? ok.reduce((a,b)=>a+b,0)/ok.length : NaN, out}; }
  const v=(q[0]*(1-tf)+q[1]*tf)*(1-tr)+(q[2]*(1-tf)+q[3]*tf)*tr;
  return {v, out};
}
function aeroAt(fw, rw, frh, rrh){
  const wi=AERO.rw.indexOf(rw), fi=AERO.fw.indexOf(fw);
  if(wi<0||fi<0||!isFinite(frh)||!isFinite(rrh)) return null;
  const F=interpRH(AERO.rhF,rrh,frh), Z=interpRH(AERO.rhZ,rrh,frh), X=interpRH(AERO.rhX,rrh,frh);
  return { F: AERO.wingF[wi][fi]+F.v, Z: AERO.wingZ[wi][fi]+Z.v, X: AERO.wingX[wi][fi]+X.v, out:F.out||Z.out||X.out };
}
// Confronto come nel foglio Aerodynamic: delta additivi; correzione T aria (ΔT/100·0,54) su SCz e SCx
function aeroDelta(a, b, tA=NaN, tB=NaN){
  if(!a||!b) return null;
  const tc = (isFinite(tA)&&isFinite(tB)) ? (tB-tA)/100*0.54 : 0;
  const dZ=b.Z-a.Z-tc, dX=b.X-a.X-tc;
  return { dF:b.F-a.F, dZ, dX, eff: (1+dZ)/(1+dX)-1, out:a.out||b.out, tc };
}
function aeroOfSetup(st){ return aeroAt(st.fw, st.rw, avg2(st.rhF), avg2(st.rhR)); }
function avg2(v){ const a=(Array.isArray(v)?v:[v,v]).map(num).filter(isFinite); return a.length? a.reduce((x,y)=>x+y,0)/a.length : NaN; }
function rollStiff(axle, dia, blade){ return (ARB[axle][String(num(dia))]||{})[String(num(blade))] ?? NaN; }
function springRoll(axle, rate, track){ const k=GROUND_K[axle][String(num(rate))]; return (isFinite(k)&&isFinite(track)&&track>0) ? k*track*track/2*Math.PI/180/1000 : NaN; }
function mrbOf(p){
  const aF=rollStiff('F',p.arbF,p.bladeF), aR=rollStiff('R',p.arbR,p.bladeR);
  const arb = aF/(aF+aR)*100;
  const sF=springRoll('F',p.springF,p.trackF), sR=springRoll('R',p.springR,p.trackR);
  const tot = (isFinite(sF)&&isFinite(sR)) ? (aF+sF)/(aF+sF+aR+sR)*100 : NaN;
  return {aF,aR,arb,sF,sR,tot};
}
function mrbOfSetup(st){
  const t=S.prefs.track||{};
  return mrbOf({arbF:st.arbF,bladeF:st.bladeF,arbR:st.arbR,bladeR:st.bladeR,springF:avg2(st.springF),springR:avg2(st.springR),trackF:num(t.F),trackR:num(t.R)});
}
function weightsOf(st){
  const c=[...(st.cwF||[]),...(st.cwR||[])].map(num);
  if(c.length<4||c.some(v=>!isFinite(v))) return null;
  const tot=c.reduce((a,b)=>a+b,0);
  return {tot, front:(c[0]+c[1])/tot*100, cross:(c[0]+c[3])/tot*100};
}
const pct = (v,d=1) => isFinite(v) ? (v>0?'+':'')+(v*100).toFixed(d)+' %' : '–';
const sg3 = v => isFinite(v) ? (v>0?'+':'')+v.toFixed(3) : '–';

// Salvataggio eventi: uno alla volta per evento, sempre con l'ultimo stato.
// Mentre un evento ha modifiche in attesa, i dati in arrivo dal server non lo sovrascrivono.
const evQ={};
function evDirty(id){ const q=evQ[id]; return !!q && (q.inflight||q.pending||q.waiting); }
function saveEvent(ev, now=false){
  const q=evQ[ev.id]||(evQ[ev.id]={});
  clearTimeout(q.timer); q.waiting=true;
  const go=()=>{ q.waiting=false; flushEvent(ev.id); };
  if(now) go(); else q.timer=setTimeout(go,800);
}
async function flushEvent(id){
  const q=evQ[id]||(evQ[id]={});
  if(q.inflight){ q.pending=true; return; }
  const ev=S.events[id]; if(!ev){ q.pending=false; return; }
  q.inflight=true; q.pending=false;
  const {id:_omit, ...data}=ev;
  const ok=await persist(id, {...JSON.parse(JSON.stringify(data)), kind:'event'});
  if(!ok){ q.failed=(q.failed||0)+1; if(q.failed<5){ q.pending=true; await new Promise(r=>setTimeout(r,1200*q.failed)); } }
  else q.failed=0;
  q.inflight=false;
  if(q.pending) flushEvent(id);
  else if(S.mode==='cloud') setSync('Salvato nel tuo account');
}

  ];

function aeroOut(){
  const c=S.calc, A=aeroAt(c.a.fw,c.a.rw,num(c.a.frh),num(c.a.rrh)), B=aeroAt(c.b.fw,c.b.rw,num(c.b.frh),num(c.b.rrh));

  if(!d) return `<div class="note">Inserisci ali e altezze per entrambe le colonne.</div>`;
  const big=(l,v,hint)=>`<div class="ctile"><div class="lbl">${l}</div><div class="big">${v}</div><div class="delta">${hint}</div></div>`;

    ${big('Δ carico totale', pct(d.dZ), 'SCz')}
    ${big('Δ resistenza', pct(d.dX), 'SCx')}

function updateConv(){
  const v=S.calc.conv, ax=v.axle, mr=MRATIO[ax];
  const kgmm=lb=>num(lb)*0.45/25.4;
  const w=num(ax==='F'?v.wF:v.wR);
  const set=(id,h)=>{const e=$('#'+id); if(e) e.innerHTML=h;};
  if(isFinite(w)&&w>0){
    const d1=w/kgmm(v.from)*mr, d2=w/kgmm(v.to)*mr, dr=d1-d2;
    set('cvSpring',`Compressione ${d1.toFixed(1)} → ${d2.toFixed(1)} mm: l'altezza ${dr>=0?'sale':'scende'} di <b>${Math.abs(dr).toFixed(1)} mm</b> per lato a parità di regolazione.`);
  } else set('cvSpring','Inserisci il peso ruota.');
  const f=(x,d=2)=>isFinite(x)?x.toFixed(d):'–';
  set('cvPre',`Ant. ${f(num(v.preload)*ADJ.preloadPitch*MRATIO.F,1)} mm · Post. ${f(num(v.preload)*ADJ.preloadPitch*MRATIO.R,1)} mm di altezza`);
  const drh=num(v.drh); set('cvRh',`Ant. ${f(drh/ADJ.rhTurn.F)} giri (${f(drh/ADJ.rhTurn.F*6,1)} facce) · Post. ${f(drh/ADJ.rhTurn.R)} giri (${f(drh/ADJ.rhTurn.R*6,1)} facce)`);
  const dc=num(v.dcam); set('cvCam',`Ant. ${f(dc/ADJ.camberMm.F,1)} mm di spessori · Post. ${f(dc/ADJ.camberMm.R,1)} mm`);
  const dt=num(v.dtoe); set('cvToe',`Ant. ${f(dt/ADJ.toeTurn.F*6,1)} facce · Post. ${f(dt/ADJ.toeTurn.R*6,1)} facce`);
  set('cvCas',`${f(num(v.dcas)/ADJ.casterTurn)} giri`);
  set('cvBr',`${f(num(v.dbr)/ADJ.brakeTurn)} giri ${num(v.dbr)>=0?'in senso orario':'in senso antiorario'}`);
}

function onSetupField(el){

  else ses.setup[k]=el.value;
  const prev=prevSession(ev,ses);
  if(prev){ const pv=f.lr?(prev.setup[k]||[])[+sd]:prev.setup[k]; const cell=$('#c_'+k+(f.lr?'_'+sd:'')); const ch=norm(el.value)!==norm(pv);

  saveEvent(ev);
}

function toeDeg(v){ // "1out" / "0.5in" / numero (positivo = chiusa)  → gradi, positivo = punta verso l'interno
  const s=String(v??'').toLowerCase().replace(',','.'); const n=parseFloat(s.replace(/[^0-9.\-]/g,''));
  if(!isFinite(n)) return 0;
  const mm = /out|ap/.test(s) ? -Math.abs(n) : /in|ch/.test(s) ? Math.abs(n) : n;
  return Math.atan(mm/330)*180/Math.PI; // al cerchio da 13"
}
const camDeg = v => { const n=num(v); return isFinite(n) ? -Math.abs(n) : 0; }; // camber negativo

const SIDE_TOP=[[26,6],[40,12],[80,22],[120,30],[160,38],[190,46],[204,52],[208,48],[236,48],[242,58],[248,90],[266,94],[274,84],[300,68],[340,56],[380,46],[404,44],[406,10]];
function sideGeom(frh, rrh){
  const k=VX.rh*0.6, yF=186-8-frh*k, yR=186-8-rrh*k;
  const y=x=> yF+(yR-yF)*(x-60)/346;
  const pt=([x,hh])=>`${x} ${(y(x)-hh).toFixed(1)}`;
  const d=`M${pt(SIDE_TOP[0])} `+SIDE_TOP.slice(1).map(p=>'L'+pt(p)).join(' ')+` L406 ${y(406).toFixed(1)} L60 ${y(60).toFixed(1)} L26 ${(y(26)-2).toFixed(1)} Z`;
  const pod=`M188 ${(y(188)-10).toFixed(1)} L196 ${(y(196)-38).toFixed(1)} L326 ${(y(326)-34).toFixed(1)} L336 ${(y(336)-12).toFixed(1)} Z`;
  const halo=`M204 ${(y(204)-54).toFixed(1)} C214 ${(y(214)-72).toFixed(1)} 236 ${(y(236)-70).toFixed(1)} 244 ${(y(244)-62).toFixed(1)}`;
  const fep=`M14 ${(y(14)-2).toFixed(1)} L44 ${(y(44)-2).toFixed(1)} L44 ${(y(44)-22).toFixed(1)} L14 ${(y(14)-20).toFixed(1)} Z`;
  const rep=`M388 ${(y(388)-30).toFixed(1)} L424 ${(y(424)-30).toFixed(1)} L428 ${(y(428)-100).toFixed(1)} L396 ${(y(396)-100).toFixed(1)} Z`;
  return {d,pod,halo,fep,rep,y};
}
function updateViz(st, prev){
  const root=document.querySelector('.viz'); if(!root) return;
  const q=id=>document.getElementById(id);
  const P=prev||st;
  const cp=(k,sd)=>prev && norm((st[k]||[])[sd])!==norm((prev[k]||[])[sd]);
  CORNERS.forEach(c=>{
    const k=c.ax==='F'?'toeF':'toeR', ck=c.ax==='F'?'camberF':'camberR', rk=c.ax==='F'?'rhF':'rhR';
    const sgn = c.sd===0 ? 1 : -1;
    const a = toeDeg((st[k]||[])[c.sd])*VX.toe*sgn, ap = toeDeg((P[k]||[])[c.sd])*VX.toe*sgn;
    const w=q('w'+c.id), g=q('g'+c.id);
    if(w){ w.style.transform=`rotate(${a}deg)`; w.classList.toggle('chg', cp(k,c.sd)); }
    if(g){ g.style.transform=`rotate(${ap}deg)`; g.style.opacity = (prev && Math.abs(a-ap)>0.01)?1:0; }
    const t=q('t'+c.id); if(t){
      const parts=[[`H ${(st[rk]||[])[c.sd]??'–'}`,cp(rk,c.sd)],[`C ${(st[ck]||[])[c.sd]??'–'}°`,cp(ck,c.sd)],[`T ${(st[k]||[])[c.sd]??'–'}`,cp(k,c.sd)]];
      t.innerHTML = parts.map(([s,ch],i)=>`<tspan x="${t.getAttribute('x')}" dy="${i?14:0}" class="${ch?'chg':''}">${esc(s)}</tspan>`).join('');
    }
  });
  const w=weightsOf(st), tw=q('tWB'); if(tw) tw.textContent = w ? `${w.tot.toFixed(1)} kg · ${w.front.toFixed(1)} % ant. · incrociato ${w.cross.toFixed(1)} %` : '';
  ['F','R'].forEach(ax=>{
    const rk=ax==='F'?'rhF':'rhR', ck=ax==='F'?'camberF':'camberR';
    const h=avg2(st[rk]), hp=avg2(P[rk]), lift=(isFinite(h)?h:0)*VX.rh;
    const b=q('e'+ax+'body'); if(b){ b.style.transform=`translateY(${186-lift}px)`; b.classList.toggle('chg', cp(rk,0)||cp(rk,1)); }
    [0,1].forEach(sd=>{
      const L = ax==='F' ? (sd===0?'R':'L') : (sd===0?'L':'R'), sg = L==='L' ? 1 : -1;
      const a=camDeg((st[ck]||[])[sd])*VX.camber*-sg, ap=camDeg((P[ck]||[])[sd])*VX.camber*-sg;
      const e=q('e'+ax+L), g=q('xg'+ax+L);
      if(e){ e.style.transform=`rotate(${a}deg)`; e.classList.toggle('chg', cp(ck,sd)); }
      if(g){ g.style.transform=`rotate(${ap}deg)`; g.style.opacity=(prev&&Math.abs(a-ap)>0.01)?1:0; }
      const t=q('et'+ax+L); if(t){ t.textContent=`${(st[ck]||[])[sd]??'–'}°`; t.classList.toggle('chg', cp(ck,sd)); }
    });
    const d=q('d'+ax); if(d){ d.setAttribute('y1',186); d.setAttribute('y2',186-lift); }
    // bracci: dal telaio (si muove con l'altezza) al portamozzo (ruota con il camber)
    const ar=q('ar'+ax); if(ar){
      const F=ax==='F', wW=F?32:40, wH=F?62:66, xs={L:F?68:62, R:F?232:238};
      const pk=F?{up:[110,-44],lo:[112,-20]}:{up:[114,-30],lo:[110,-8]}, by=186-lift;
      let path='';
      ['L','R'].forEach(L=>{
        const sd = ax==='F' ? (L==='R'?0:1) : (L==='L'?0:1), sg=L==='L'?1:-1;
        const a=camDeg((st[ck]||[])[sd])*VX.camber*-sg*Math.PI/180;
        const cx=xs[L], inner=L==='L'?cx+wW/2-4:cx-wW/2+4, mx=L==='L'?1:-1;
        const rot=(px,py)=>{ const dx=px-cx, dy=py-186; return [cx+dx*Math.cos(a)-dy*Math.sin(a), 186+dx*Math.sin(a)+dy*Math.cos(a)]; };
        const hu=rot(inner,186-wH*0.68), hl=rot(inner,186-wH*0.3);
        const cxp=x=> L==='L'?x:300-x;
        const [ux,uy]=pk.up, [lx,ly]=pk.lo;
        path+=`M${cxp(ux)} ${by+uy} L${hu[0].toFixed(1)} ${hu[1].toFixed(1)} M${cxp(lx)} ${by+ly} L${hl[0].toFixed(1)} ${hl[1].toFixed(1)} `;
        path+=`M${cxp(lx)} ${by+ly-6} L${hu[0].toFixed(1)} ${(hu[1]+4).toFixed(1)} `; // puntone
      });
      ar.setAttribute('d', path);
    }
    const th=q('t'+ax+'H'); if(th){ th.textContent=`altezza ${isFinite(h)?h.toFixed(1):'–'} mm${prev&&isFinite(h)&&isFinite(hp)&&Math.abs(h-hp)>0.01?` (prima ${hp.toFixed(1)})`:''}`; th.classList.toggle('chg', cp(rk,0)||cp(rk,1)); }
  });
  const frh=avg2(st.rhF), rrh=avg2(st.rhR), pf=avg2(P.rhF), pr=avg2(P.rhR);
  const cur=sideGeom(isFinite(frh)?frh:0, isFinite(rrh)?rrh:0), old=sideGeom(isFinite(pf)?pf:0, isFinite(pr)?pr:0);
  setD(q('sBody'), cur.d); setD(q('gSide'), old.d); setD(q('sPod'), cur.pod); setD(q('sHalo'), cur.halo); setD(q('sFEP'), cur.fep); setD(q('sREP'), cur.rep);
  q('gSide').style.opacity = (prev && (Math.abs(frh-pf)>0.01||Math.abs(rrh-pr)>0.01)) ? 1 : 0;
  q('sBody').classList.toggle('chg', cp('rhF',0)||cp('rhF',1)||cp('rhR',0)||cp('rhR',1));
  const fwA=parseFloat(st.fw)||0, rwA=RW_DEG[st.rw]??0;
  const sfw=q('sFW'), srw=q('sRW');
  sfw.style.transform=`translate(34px,${cur.y(34)-8}px) rotate(${-fwA*VX.wing}deg)`; sfw.classList.toggle('chg', !!prev && norm(st.fw)!==norm(prev.fw));
  srw.style.transform=`translate(410px,${cur.y(410)-86}px) rotate(${-rwA*VX.wing}deg)`; srw.classList.toggle('chg', !!prev && norm(st.rw)!==norm(prev.rw));
  q('tSF').textContent=`Ala ant. ${st.fw||'–'}`; q('tSF').classList.toggle('chg', !!prev && norm(st.fw)!==norm(prev.fw));
  q('tSR').textContent=`Ala post. ${st.rw||'–'} (${rwA}°)`; q('tSR').classList.toggle('chg', !!prev && norm(st.rw)!==norm(prev.rw));
  q('tRake').textContent = isFinite(frh)&&isFinite(rrh) ? `rake ${(rrh-frh).toFixed(1)} mm` : '';
}

    const d=diffs(prev.setup, ses.setup);
    ch = d.length ? `<div class="chglist"><span class="lbl">${d.length} modifiche rispetto a ${esc(prev.name)}</span>${d.map(x=>`<span class="chgi"><b>${esc(dLabel(x))}</b> ${fmtVal(x.f,x.from)} → <span class="to">${fmtVal(x.f,x.to)}</span></span>`).join('')}</div>`
      : `<div class="note">Nessuna modifica rispetto a ${esc(prev.name)}: cambia un valore e lo vedi evidenziato, anche sulla vettura.</div>`;
  } else ch = `<div class="note">Setup base di inizio giornata. Crea un nuovo turno: copia questi valori e mostra solo le modifiche.</div>`;
  return ch + techBlock(ses.setup, prev?base.setup:null, base.name);
}

/* ---------- backup e installazione (versione app) ---------- */
document.addEventListener('click', e=>{
  if(e.target.id!=='expData') return;
  const data={app:'tyres-pressure', version:2, exported:new Date().toISOString(), docs:lsGet('pg_docs',{})};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='tyres-pressure-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('Backup esportato');
});
document.addEventListener('change', e=>{
  if(e.target.id!=='impFile' || !e.target.files[0]) return;
  const fr=new FileReader();
  fr.onload=()=>{ try{
      const d=JSON.parse(fr.result); if(!d.docs || typeof d.docs!=='object') throw 0;
      const all={...lsGet('pg_docs',{}), ...d.docs}; lsSet('pg_docs',all); ingest(all);
      const v=Object.values(d.docs); toast('Backup importato: '+v.filter(x=>x&&x.kind==='session').length+' run, '+v.filter(x=>x&&x.kind==='event').length+' eventi');
    }catch(err){ toast('File non valido: scegli un backup di Tyres Pressure'); } };
  fr.readAsText(e.target.files[0]); e.target.value='';
});
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }

render();
initStore();
</script>
