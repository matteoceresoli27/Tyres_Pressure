// A,C = quadrilatero inferiore lato telaio, B = snodo inferiore sul portamozzo; D,F = superiore lato telaio, E = snodo superiore;
// T = biella convergenza lato telaio, S = lato portamozzo; N = centro ruota; W/M = pushrod (basso/alto);
// P,Q = asse del bilanciere; V = ammortizzatore lato bilanciere, U = lato telaio.
const KIN_PTS = {
  F:{A:[-50,210.8,243.9],B:[9,657.5,225.1],C:[300,232.1,246],D:[-50,210.8,392.9],E:[32.1,628,364.2],F:[300,232.1,382.5],
     S:[-64.4,677.5,361.6],T:[-130,205.9,393.5],N:[0,757.5,253],U:[389,80,561.5],V:[82.4,81.3,560.8],P:[80,156,522.1],Q:[80,133,477.7],
     M:[41,154.4,522.9],W:[16,648.6,267]},
  R:{A:[-370,141,169.2],B:[-11.5,669,163],C:[-10,115.4,164.7],D:[-280.7,146.1,325.4],E:[-85,615.1,348.5],F:[95,101,336.8],
     S:[47.7,614.9,353.1],T:[84.6,213.5,340.4],N:[0,735,249],U:[-485,135,381.1],V:[-206.3,43.3,419],P:[-180,123.5,385.9],Q:[-180,85.3,293.5],
     M:[-140.8,116.2,388.9],W:[-37.2,592.7,192.1]}
};
const KIN_RC_MANUAL = {F:-3.5, R:1.0};   // centro di rollio dal piano di riferimento, configurazione standard (§5.7.3)
const kv = {
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.hypot(a[0],a[1],a[2]), norm:a=>{ const l=Math.hypot(a[0],a[1],a[2]); return [a[0]/l,a[1]/l,a[2]/l]; },
  dist:(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2])
};
// rotazione di p attorno all'asse (o, u) di un angolo t (Rodrigues)
function kinRot(p,o,u,t){ const v=kv.sub(p,o), c=Math.cos(t), s=Math.sin(t);
  const r=kv.add(kv.add(kv.mul(v,c), kv.mul(kv.cross(u,v),s)), kv.mul(u,kv.dot(u,v)*(1-c))); return kv.add(r,o); }
// intersezione di tre sfere (centri p1..p3, raggi r1..r3): restituisce la soluzione più vicina a 'near'
function kinTri(p1,r1,p2,r2,p3,r3,near){
  const ex=kv.norm(kv.sub(p2,p1)), i=kv.dot(ex,kv.sub(p3,p1));
  const ey=kv.norm(kv.sub(kv.sub(p3,p1),kv.mul(ex,i))), ez=kv.cross(ex,ey);
  const d=kv.dist(p2,p1), j=kv.dot(ey,kv.sub(p3,p1));
  const x=(r1*r1-r2*r2+d*d)/(2*d), y=(r1*r1-r3*r3+i*i+j*j)/(2*j)-(i/j)*x;
  const z2=r1*r1-x*x-y*y; if(z2<-1) return null; const z=Math.sqrt(Math.max(0,z2));
  const base=kv.add(p1,kv.add(kv.mul(ex,x),kv.mul(ey,y)));
  const s1=kv.add(base,kv.mul(ez,z)), s2=kv.sub(base,kv.mul(ez,z));
  return kv.dist(s1,near)<=kv.dist(s2,near)?s1:s2;
}
// trasformazione rigida che porta la terna (a0,b0,c0) in (a1,b1,c1): restituisce f(p)
function kinFrame(a0,b0,c0,a1,b1,c1){
  const F=(a,b,c)=>{ const e1=kv.norm(kv.sub(b,a)), e3=kv.norm(kv.cross(e1,kv.sub(c,a))), e2=kv.cross(e3,e1); return [e1,e2,e3]; };
  const f0=F(a0,b0,c0), f1=F(a1,b1,c1);
  return p=>{ const v=kv.sub(p,a0), l=[kv.dot(v,f0[0]),kv.dot(v,f0[1]),kv.dot(v,f0[2])];
    return kv.add(a1,kv.add(kv.add(kv.mul(f1[0],l[0]),kv.mul(f1[1],l[1])),kv.mul(f1[2],l[2]))); };
}
// posizione della sospensione per una rotazione t del quadrilatero inferiore attorno ad A–C
function kinPose(ax, t, Rd){
  const P=KIN_PTS[ax], G=KIN_GEO[ax];
  const B=kinRot(P.B,P.A,G.uAC,t);
  const E=kinTri(P.D,G.lDE,P.F,G.lFE,B,G.lBE,P.E); if(!E) return null;
  const S=kinTri(P.T,G.lTS,B,G.lBS,E,G.lES,P.S); if(!S) return null;
  const tf=kinFrame(P.B,P.E,P.S,B,E,S);
  const N=tf(P.N), Wp=tf(P.W), axis=kv.norm(kv.sub(tf(kv.add(P.N,[0,1,0])),N));
  // punto di contatto: il punto più basso del cerchio ruota (raggio Rd) nel piano della ruota
  const dn=kv.norm(kv.sub([0,0,-1],kv.mul(axis,kv.dot([0,0,-1],axis))));
  const L=kv.add(N,kv.mul(dn,Rd));
  // bilanciere: rotazione phi attorno a P–Q che mantiene costante la lunghezza del pushrod
  const g=phi=>kv.dist(kinRot(P.M,P.P,G.uPQ,phi),Wp)-G.lWM;
  let a=-0.6,b=0.6,fa=g(a); for(let k=0;k<60;k++){ const m=(a+b)/2, fm=g(m); if((fm>0)===(fa>0)){ a=m; fa=fm; } else b=m; }
  const phi=(a+b)/2, M=kinRot(P.M,P.P,G.uPQ,phi), V=kinRot(P.V,P.P,G.uPQ,phi);
  // convenzioni del manuale (§5.1): camber + = parte alta della ruota verso l'esterno; toe + = convergenza aperta (toe-out)
  // con la ruota inclinata in fuori l'asse di rotazione punta verso il basso; con il muso della ruota in fuori l'asse punta indietro (X+)
  const camber=-Math.atan2(axis[2],axis[1])*180/Math.PI;
  const toe=Math.atan2(axis[0],axis[1])*180/Math.PI;
  return {t,B,E,S,N,L,W:Wp,M,V,axis,camber,toe,damper:kv.dist(P.U,V),phi};
}
const KIN_GEO={};
['F','R'].forEach(ax=>{ const P=KIN_PTS[ax];
  KIN_GEO[ax]={uAC:kv.norm(kv.sub(P.C,P.A)), uPQ:kv.norm(kv.sub(P.Q,P.P)), lDE:kv.dist(P.D,P.E), lFE:kv.dist(P.F,P.E), lBE:kv.dist(P.B,P.E),
    lTS:kv.dist(P.T,P.S), lBS:kv.dist(P.B,P.S), lES:kv.dist(P.E,P.S), lWM:kv.dist(P.W,P.M)}; });
// interseca le rette (p1,d1) e (p2,d2) nel piano Y–Z
function kinLine2(p1,d1,p2,d2){ const det=d1[0]*d2[1]-d1[1]*d2[0]; if(Math.abs(det)<1e-12) return null;
  const s=((p2[0]-p1[0])*d2[1]-(p2[1]-p1[1])*d2[0])/det; return [p1[0]+d1[0]*s, p1[1]+d1[1]*s]; }
// retta d'intersezione tra il piano (p,q,r) e il piano X = x0, proiettata in (Y,Z)
function kinPlaneCut(p,q,r,x0){ const n=kv.cross(kv.sub(q,p),kv.sub(r,p));   // n·(X−p)=0, con X=x0 → n1·y + n2·z = n·p − n0·x0
  const k=kv.dot(n,p)-n[0]*x0; const dir=[-n[2],n[1]];
  const pt=Math.abs(n[2])>Math.abs(n[1])?[0,k/n[2]]:[k/n[1],0]; return {pt,dir}; }
// centro di rollio in vista frontale per un affondamento simmetrico (stessa posizione sui due lati)
function kinRC(ax, pose){
  const P=KIN_PTS[ax];
  const lo=kinPlaneCut(P.A,P.C,pose.B,pose.N[0]), up=kinPlaneCut(P.D,P.F,pose.E,pose.N[0]);
  const ic=kinLine2(lo.pt,lo.dir,up.pt,up.dir); if(!ic) return null;
  const c=[pose.L[1],pose.L[2]];
  // retta contatto → centro istantaneo, intersecata con la mezzeria (Y = 0)
  const dy=ic[0]-c[0], dz=ic[1]-c[1]; if(Math.abs(dy)<1e-9) return null;
  return {ic, rc:c[1]+dz*(0-c[0])/dy, contact:c};
}
// Raggio ruota con cui il manuale calcola i centri di rollio: con 263 mm ant. e 278 mm post. questo risolutore
// ritrova esattamente −3,5 e +1,0 mm (§5.7.3). Posizione di progetto = piano di riferimento a Rd − Zn da terra (10 / 29 mm).
const KIN_RD = {F:263, R:278};
const kinDesignRH = ax => KIN_RD[ax]-KIN_PTS[ax].N[2];
const KIN_CACHE = {};
// curva completa in funzione dell'altezza da terra del piano di riferimento (rh): escursione z = rh di progetto − rh (+ = compressione)
function kinSweep(ax){
  if(KIN_CACHE[ax]) return KIN_CACHE[ax];
  const Rd=KIN_RD[ax], hD=kinDesignRH(ax), p0=kinPose(ax,0,Rd); if(!p0) return null;
  const tAt=dz=>{ let a=-0.6,b=0.6; for(let k=0;k<50;k++){ const m=(a+b)/2, pz=kinPose(ax,m,Rd); if(!pz) return NaN; if((pz.N[2]-p0.N[2])<dz) a=m; else b=m; } return (a+b)/2; };
  const pts=[]; for(let z=-60; z<=45; z+=1){ const p=kinPose(ax,tAt(z),Rd); if(!p) continue; const r=kinRC(ax,p);
    pts.push({z, rh:hD-z, camber:p.camber-p0.camber, toe:p.toe-p0.toe, damper:p0.damper-p.damper, rcRef:r?r.rc:NaN, pose:p, rcInfo:r}); }
  pts.forEach((o,i)=>{ const a=pts[Math.max(0,i-1)], b=pts[Math.min(pts.length-1,i+1)]; o.mr=(b.z-a.z)/(b.damper-a.damper); o.rcGround=o.rcRef+o.rh; });
  const at=rh=>{ const z=hD-rh; if(!isFinite(z)) return null; let k=pts.findIndex(o=>o.z>=z); if(k<0) k=pts.length-1; if(k===0) k=1;
    const a=pts[k-1], b=pts[k], f=Math.max(0,Math.min(1,(z-a.z)/(b.z-a.z))), L=x=>a[x]+(b[x]-a[x])*f;
    return {rh, z, camber:L('camber'), toe:L('toe'), damper:L('damper'), rcRef:L('rcRef'), rcGround:L('rcRef')+rh, mr:L('mr'), pose:(f<0.5?a:b).pose, rcInfo:(f<0.5?a:b).rcInfo, out:z<pts[0].z||z>pts[pts.length-1].z}; };
  return (KIN_CACHE[ax]={ax, Rd, hD, pts, p0, at});
}
// centro di rollio da terra per un'altezza statica: anteriore dalla cinematica; posteriore dalla cinematica se l'attacco è
// lo standard BE23, altrimenti valore di tabella del manuale + variazione con l'altezza calcolata sulla geometria BE23
function kinRCground(ax, rh, tableRC){
  const s=kinSweep(ax); if(!s) return NaN; const a=s.at(rh); if(!a) return NaN;
  if(ax==='F'||!isFinite(tableRC)) return a.rcGround;
  const d=s.at(s.hD); return tableRC+s.hD+(a.rcGround-d.rcGround);
}


/* ---------- Calcolatore › Cinematica: vista frontale animata e curve ---------- */
const KV = {ax:'F', rh:{}, play:false, mag:5, raf:0, t0:0};
const KIN_TYRE = {F:{w:200}, R:{w:250}};
const KIN_RANGE = {F:[-5,55], R:[5,75]};
function kinCtx(){
  const ses=curSession(), st=ses?ses.setup:BASE_SETUP, ve=vehicle(st), m=mechModel(S.calc.a, ve);
  const stat={F:num(S.calc.a.frh), R:num(S.calc.a.rrh)};
  if(!isFinite(stat.F)) stat.F=avg2(st.rhF); if(!isFinite(stat.R)) stat.R=avg2(st.rhR);
  const dyn={F:m.dynF, R:m.dynR};
  return {st, ve, m, stat, dyn, set:kinSet(st), src:ses?'turno attuale':'setup base'};
}
// camber e convergenza statici dal setup del turno (media sx/dx): convergenza in convenzione manuale, + = aperta, per ruota
function kinSet(st){
  const o={};
  [['F','camberF','toeF'],['R','camberR','toeR']].forEach(([ax,ck,tk])=>{
    const c=(st&&st[ck])||[], t=(st&&st[tk])||[];
    const cs=[0,1].map(i=>camDeg(c[i])), ts=[0,1].map(i=>-toeDeg(t[i]));
    o[ax]={cam:(cs[0]+cs[1])/2, toe:(ts[0]+ts[1])/2, raw:{cam:c, toe:t}, diff:Math.abs(cs[0]-cs[1])>0.01||Math.abs(ts[0]-ts[1])>0.001};
  });
  return o;
}
function kinToeMm(deg){ if(!isFinite(deg)) return '–'; const mm=Math.tan(deg*Math.PI/180)*330; return Math.abs(mm)<0.05?'0,0 mm':`${Math.abs(mm).toFixed(1).replace('.',',')} mm ${mm>0?'aperta':'chiusa'}`;
}
function renderKinCalc(){
  const k=kinCtx(), ax=KV.ax, [lo,hi]=KIN_RANGE[ax];
  if(!isFinite(KV.rh[ax])) KV.rh[ax]=isFinite(k.stat[ax])?k.stat[ax]:kinSweep(ax).hD;
  const v=KV.rh[ax];
  return `<div class="panel"><h2>Cinematica sospensioni</h2>${srcBar()}
    <div class="kintop">
      <div class="seg"><button type="button" data-kinax="F" aria-pressed="${ax==='F'}">Anteriore</button><button type="button" data-kinax="R" aria-pressed="${ax==='R'}">Posteriore</button></div>
      <div class="kinsl"><label class="lbl" for="kinRh">Altezza da terra (piano di riferimento) <b id="kinRhV">${v.toFixed(1)} mm</b></label>
        <input type="range" id="kinRh" min="${lo}" max="${hi}" step="0.5" value="${Math.min(hi,Math.max(lo,v))}"></div>
      <div class="kinbtn">
        <button type="button" class="btn sm" data-kin="stat">Statica ${isFinite(k.stat[ax])?k.stat[ax].toFixed(1):'–'}</button>
        <button type="button" class="btn sm" data-kin="dyn">A ${isFinite(k.ve.V)?k.ve.V.toFixed(0):'–'} km/h ${isFinite(k.dyn[ax])?k.dyn[ax].toFixed(1):'–'}</button>
        <button type="button" class="btn sm ${KV.play?'on':''}" data-kin="play" id="kinPlay">${KV.play?'Ferma':'Anima'}</button>
        <label class="kinmag"><input type="checkbox" id="kinMag" ${KV.mag>1?'checked':''}> camber e convergenza ×5 nel disegno</label>
      </div>
    </div>
    ${(()=>{ const z=k.set[ax]; return `<div class="kinset muted">Valori statici dal ${k.src}: camber <b>${kinFmt(z.cam,2,false)}°</b> · convergenza <b>${kinToeMm(z.toe)}</b> per ruota (${kinFmt(z.toe,3)}°)${z.diff?' · media tra sinistra e destra':''}. Le variazioni si sommano a questi valori.</div>`; })()}
    <div class="kingrid"><div class="kinview" id="kinView"></div><div id="kinVals"></div></div>
    <div class="kincharts" id="kinCharts"></div>${(queueMicrotask(kinUpdate),'')}
    <div class="note">Curve calcolate muovendo la sospensione sui punti di attacco del manuale T-421 (§5.7, configurazione standard): quadrilateri, biella di convergenza, pushrod e bilanciere.
      Controllo: con i raggi ruota 263 / 278 mm il calcolo ritrova i centri di rollio del manuale (−3,5 ant., +1,0 post. BE23) e i rapporti di installazione 1,10 / 1,22 (manuale 1,1 / 1,23).
      Il manuale dà le coordinate solo per la configurazione standard: per gli altri attacchi posteriori il centro di rollio parte dal valore di tabella e varia con l'altezza come nella BE23. Camber e convergenza: segni del manuale (camber + = parte alta in fuori, convergenza + = aperta), per ruota. I valori assoluti partono dal camber e dalla convergenza impostati nel turno all'altezza statica; la cinematica aggiunge le variazioni con l'escursione.</div>
  </div>`;
}
function kinFmt(x,d=2,sg=true){ return isFinite(x)?(sg&&x>0?'+':'')+x.toFixed(d):'–'; }
function kinUpdate(){
  const view=$('#kinView'); if(!view) return;
  const k=kinCtx(), ax=KV.ax, s=kinSweep(ax), rh=KV.rh[ax], cur=s.at(rh), st=s.at(k.stat[ax]), dy=isFinite(k.dyn[ax])?s.at(k.dyn[ax]):null;
  const vEl=$('#kinRhV'); if(vEl) vEl.textContent=rh.toFixed(1)+' mm';

    ['… in gradi (+ aperta)', '°', a=>kinFmt(toe(a),3)],
    ['… Δ dalla statica', '°', a=>kinFmt(a.toe-st.toe,3)],
    ['Centro di rollio da terra', 'mm', a=>kinFmt(rc(a),1,false)],
    ['… modello lineare di prima', 'mm', a=>kinFmt(old(a.rh),1,false)],
    ['Rapporto di installazione', '', a=>a.mr.toFixed(3)],

  ];
  $('#kinVals').innerHTML=`<table class="kintab"><thead><tr><th></th><th>Statica</th><th>A ${isFinite(k.ve.V)?k.ve.V.toFixed(0):'–'} km/h</th><th class="kcur">Cursore</th></tr></thead><tbody>
    ${rows.map(([l,u,f])=>`<tr><td>${l}${u?` <span class="u">${u}</span>`:''}</td><td>${f(st)}</td><td>${dy?f(dy):'–'}</td><td class="kcur">${f(cur)}</td></tr>`).join('')}</tbody></table>
    <div class="muted kinhint">Escursione + = la vettura si abbassa (compressione). ${ax==='F'?'Anteriore':'Posteriore'} alla velocità impostata nei parametri vettura del Bilancio.</div>`;
  const xs=s.pts.map(p=>p.rh).filter(x=>x>=KIN_RANGE[ax][0]-0.01&&x<=KIN_RANGE[ax][1]+0.01).sort((a,b)=>a-b);
  const ser=f=>xs.map(x=>({x, y:f(s.at(x))}));
  const marks={stat:k.stat[ax], dyn:k.dyn[ax], cur:rh};
  $('#kinCharts').innerHTML=[
    kinChart('Camber', '°', ser(cam), null, marks, 2),
    kinChart('Convergenza per ruota (+ aperta)', '°', ser(toe), null, marks, 3),
    kinChart('Centro di rollio da terra', 'mm', ser(a=>rc(a)), ser(a=>old(a.rh)), marks, 1, 'modello lineare di prima'),
    kinChart('Rapporto di installazione', 'ruota / amm.', ser(a=>a.mr), null, marks, 3)
  ].join('');
}
// vista frontale nel riferimento del suolo: il telaio scende quando l'altezza diminuisce
function kinSVG(ax, cur, st, zs){
  const p=cur.pose, P=KIN_PTS[ax], rh=cur.rh, Rd=KIN_RD[ax], mag=KV.mag;
  const W=820, H=360, sc=0.4, cx=W/2, gy=H-34;
  const X=y=>cx+y*sc, Y=z=>gy-(z+rh)*sc;                      // punto nel riferimento telaio → schermo
  const onX=(a,b,x0)=>{ const t=(x0-a[0])/(b[0]-a[0]); return [a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; };   // asse a–b alla X del centro ruota
  const lo=onX(P.A,P.C,p.N[0]), up=onX(P.D,P.F,p.N[0]), rk=[P.P[1],P.P[2]];   // l'asse del bilanciere giace in un piano trasversale: si disegna il perno P
  const side=sg=>{ const y=v=>X(sg*v[1]), z=v=>Y(v[2]);
    const camV=(p.camber-st.camber)*mag+(zs?zs.cam:0), ang=sg*camV;   // inclinazione disegnata: camber negativo = parte alta verso il telaio
    const tw=KIN_TYRE[ax].w;
    const tyre=`<g transform="rotate(${ang.toFixed(3)} ${X(sg*p.L[1]).toFixed(1)} ${Y(p.L[2]).toFixed(1)})"><rect class="ktyre" x="${(X(sg*p.N[1])-tw*sc/2).toFixed(1)}" y="${(Y(p.N[2])-Rd*sc).toFixed(1)}" width="${(tw*sc).toFixed(1)}" height="${(2*Rd*sc).toFixed(1)}" rx="${(40*sc).toFixed(1)}"/>
      <rect class="krim" x="${(X(sg*p.N[1])-tw*sc*0.36).toFixed(1)}" y="${(Y(p.N[2])-165*sc).toFixed(1)}" width="${(tw*sc*0.72).toFixed(1)}" height="${(330*sc).toFixed(1)}" rx="4"/></g>`;
    const L=(a,b,c)=>`<line class="${c}" x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"/>`;
    const q=v=>[y(v),z(v)], q2=v=>[X(sg*v[0]),Y(v[1])];
    return `${tyre}

function kinChart(title, unit, data, ref, marks, dd, refLabel){
  const W=320, H=170, L=44, R=8, T=10, B=26;
  const ys=[...data.map(d=>d.y), ...(ref||[]).map(d=>d.y)].filter(isFinite); if(!ys.length) return '';
  let y0=Math.min(...ys), y1=Math.max(...ys); if(y1-y0<1e-6){ y0-=1; y1+=1; }
  const raw=(y1-y0)/4, mag=Math.pow(10,Math.floor(Math.log10(raw))), stp=[1,2,2.5,5,10].map(m=>m*mag).find(m=>m>=raw);
  y0=Math.floor(y0/stp)*stp; y1=Math.ceil(y1/stp)*stp; const nd=Math.max(0,-Math.floor(Math.log10(stp)+1e-9));
  const x0=data[0].x, x1=data[data.length-1].x;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R), Y=y=>T+(y1-y)/(y1-y0)*(H-T-B);
  const path=a=>a.filter(d=>isFinite(d.y)).map((d,i)=>(i?'L':'M')+X(d.x).toFixed(1)+' '+Y(d.y).toFixed(1)).join('');
  const ticks=()=>{ const o=[]; for(let v=y0; v<=y1+stp/2; v+=stp) o.push(v); return o; };
  const at=x=>{ const i=data.findIndex(d=>d.x>=x); if(i<=0) return data[0].y; const a=data[i-1], b=data[i]; return a.y+(b.y-a.y)*(x-a.x)/(b.x-a.x); };
  const mk=(x,c,lab)=>isFinite(x)&&x>=x0&&x<=x1?`<circle class="${c}" cx="${X(x)}" cy="${Y(at(x))}" r="4.5"><title>${lab}</title></circle>`:'';
  const xt=[]; for(let x=Math.ceil(x0/10)*10;x<=x1;x+=10) xt.push(x);
  return `<figure class="kchart"><figcaption>${title} <span class="u">${unit}</span></figcaption>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title} in funzione dell'altezza">
    ${ticks().map(v=>`<line class="g" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L-5}" y="${Y(v)+3.5}" text-anchor="end">${(Math.abs(v)<stp/1e3?0:v).toFixed(nd)}</text>`).join('')}
    ${xt.map(x=>`<text class="ax" x="${X(x)}" y="${H-8}" text-anchor="middle">${x}</text>`).join('')}
    ${ref?`<path class="kref2" d="${path(ref)}"/>`:''}<path class="kline" d="${path(data)}"/>
    ${isFinite(marks.cur)?`<line class="kcurl" x1="${X(marks.cur)}" x2="${X(marks.cur)}" y1="${T}" y2="${H-B}"/>`:''}
    ${mk(marks.stat,'kmS','statica')}${mk(marks.dyn,'kmD','a velocità')}${mk(marks.cur,'kmC','cursore')}
    </svg>${ref?`<div class="kleg"><span><i class="sw kl"></i>cinematica</span><span><i class="sw kl dash"></i>${refLabel}</span></div>`:''}</figure>`;
}

/* ---------- sincronizzazione tra dispositivi (solo versione web app) ----------
   Archivio online Supabase (gratuito): tabella wb_docs (ws, id, data, u, deleted, t).
   Ogni dispositivo salva prima in locale (funziona offline), poi invia le modifiche e scarica quelle degli altri.
   Conflitti: fusione a tre vie col l'ultima versione sincronizzata; i turni di un evento si fondono per id.
*/
const SY = { cfg:null, busy:false, timer:null, last:0, err:'', defer:{} };
const syGet = (k,d) => { try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } };
const sySet = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } };
SY.cfg = syGet('pg_sync', null);

function syOn(){ return !!(SY.cfg && SY.cfg.url && SY.cfg.key && SY.cfg.ws); }
function syHeaders(extra){ return {'apikey':SY.cfg.key, 'x-wb-ws':SY.cfg.ws, 'Content-Type':'application/json', ...(extra||{})}; }
function syBase(){ return SY.cfg.url.replace(/\/+$/,'')+'/rest/v1/wb_docs'; }
function syDirty(){ return syGet('pg_dirty', {}); }
function syStatus(){
  if(!syOn()) return;
  const n=Object.keys(syDirty()).length;
  const t=SY.last?new Date(SY.last).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):'';
  setSync(!navigator.onLine ? `Offline · ${n} modific${n===1?'a':'he'} in attesa` :
    SY.err ? `Sincronizzazione: ${SY.err}` :
    n ? `Sincronizzo… (${n})` : `Sincronizzato${t?' · '+t:''}`);
  const b=document.getElementById('syncState'); if(b) b.textContent=document.getElementById('sync').textContent;
}

// fusione a tre vie: b = ultima versione sincronizzata, l = locale, r = remota
const syEq = (a,b) => stable(a)===stable(b);
const syObj = v => v && typeof v==='object' && !Array.isArray(v);
const syIdArr = v => Array.isArray(v) && v.length>0 && v.every(x=>syObj(x) && x.id!=null);
function syMerge(b,l,r){
  if(syEq(l,r)) return l;
  if(syEq(l,b)) return r;
  if(syEq(r,b)) return l;
  if(syObj(l) && syObj(r)){
    const o={}, bb=syObj(b)?b:{};
    new Set([...Object.keys(l),...Object.keys(r)]).forEach(k=>{ const v=syMerge(bb[k], l[k], r[k]); if(v!==undefined) o[k]=v; });
    return o;
  }
  if((syIdArr(l)||Array.isArray(l)&&!l.length) && (syIdArr(r)||Array.isArray(r)&&!r.length) && (syIdArr(l)||syIdArr(r))){
    const bm=new Map((Array.isArray(b)?b:[]).filter(syObj).map(x=>[x.id,x])), lm=new Map(l.map(x=>[x.id,x])), rm=new Map(r.map(x=>[x.id,x]));
    const ids=[...l.map(x=>x.id), ...r.map(x=>x.id).filter(id=>!lm.has(id))], out=[];
    ids.forEach(id=>{
      const bi=bm.get(id), li=lm.get(id), ri=rm.get(id);
      if(li && ri){ out.push(syMerge(bi,li,ri)); return; }
      const only=li||ri;
      if(bi && syEq(only,bi)) return;          // cancellato dall'altra parte senza modifiche qui
      out.push(only);
    });
    return out;
  }
  return l;  // stesso campo cambiato da entrambe le parti: vince questo dispositivo
}

async function syPull(){
  const since=syGet('pg_sync_t', '1970-01-01T00:00:00Z');
  const from=new Date(new Date(since).getTime()-5000).toISOString();   // 5 s di sovrapposizione
  const r=await fetch(`${syBase()}?select=id,data,u,deleted,t&ws=eq.${encodeURIComponent(SY.cfg.ws)}&t=gt.${encodeURIComponent(from)}&order=t.asc&limit=1000`, {headers:syHeaders(), cache:'no-store'});
  if(!r.ok) throw new Error(r.status===401||r.status===403?'chiave non valida':r.status===404?'tabella mancante (esegui lo script SQL)':'errore '+r.status);
  const rows=await r.json();
  const pending={...SY.defer}; SY.defer={};
  rows.forEach(x=>pending[x.id]=x);
  if(!Object.keys(pending).length) return false;
  const all=lsGet('pg_docs',{}), base=syGet('pg_sbase',{}), dirty=syDirty();
  let changed=false, maxT=since;
  Object.values(pending).forEach(row=>{
    if(row.t>maxT) maxT=row.t;
    if(typeof evDirty==='function' && evDirty(row.id)){ SY.defer[row.id]=row; return; }   // evento in scrittura: lo applico al giro dopo
    const rem=row.deleted?undefined:row.data, loc=all[row.id];
    if(syEq(loc,rem)){ if(rem===undefined) delete base[row.id]; else base[row.id]=rem; if(dirty[row.id]&&syEq(loc,rem)) delete dirty[row.id]; return; }
    let nv;
    if(dirty[row.id]){ nv=syMerge(base[row.id], loc, rem); if(syEq(nv,rem)) delete dirty[row.id]; }
    else nv=rem;
    if(nv===undefined) delete all[row.id]; else all[row.id]=nv;
    if(rem===undefined) delete base[row.id]; else base[row.id]=rem;
    changed=true;
  });
  sySet('pg_sbase',base); sySet('pg_dirty',dirty); sySet('pg_sync_t',maxT);
  if(changed){ lsSet('pg_docs',all); ingest(all); }
  return changed;
}

async function syPush(){
  const dirty=syDirty(), ids=Object.keys(dirty); if(!ids.length) return;
  const all=lsGet('pg_docs',{});
  const rows=ids.map(id=>({ws:SY.cfg.ws, id, data:all[id]===undefined?null:all[id], u:dirty[id], deleted:all[id]===undefined}));
  for(let i=0;i<rows.length;i+=50){
    const part=rows.slice(i,i+50);
    const r=await fetch(`${syBase()}?on_conflict=ws,id`, {method:'POST', headers:syHeaders({'Prefer':'resolution=merge-duplicates,return=minimal'}), body:JSON.stringify(part)});
    if(!r.ok) throw new Error(r.status===401||r.status===403?'chiave non valida':'invio non riuscito ('+r.status+')');
    const d2=syDirty(), base=syGet('pg_sbase',{});
    part.forEach(x=>{ if(d2[x.id]===x.u){ delete d2[x.id]; if(x.deleted) delete base[x.id]; else base[x.id]=x.data; } });
    sySet('pg_dirty',d2); sySet('pg_sbase',base);
  }
}

async function syRun(){
  if(!syOn() || SY.busy) return;
  if(!navigator.onLine){ syStatus(); return; }
  SY.busy=true; syStatus();
  try{ await syPull(); await syPush(); SY.err=''; SY.last=Date.now(); }
  catch(e){ SY.err=(e && e.message && !/fetch/i.test(e.message)) ? e.message : 'rete non raggiungibile'; }
  SY.busy=false; syStatus();
}
function sySoon(ms=1500){ clearTimeout(SY.timer); SY.timer=setTimeout(syRun, ms); }

// ogni salvataggio locale segna il documento da inviare
function syMark(id){ if(!syOn()) return; const d=syDirty(); d[id]=Date.now(); sySet('pg_dirty',d); sySoon(); syStatus(); }
const _persistLocal=persist, _removeLocal=remove;
persist = async function(id, data){ const ok=await _persistLocal(id, data); if(ok && S.mode!=='cloud') syMark(id); return ok; };
remove = async function(id){ await _removeLocal(id); if(S.mode!=='cloud') syMark(id); };

// primo collegamento: tutti i documenti locali vanno fusi con quelli online
function syConnect(cfg){
  SY.cfg=cfg; sySet('pg_sync',cfg);
  sySet('pg_sync_t','1970-01-01T00:00:00Z'); sySet('pg_sbase',{});
  const all=lsGet('pg_docs',{}), d={}, now=Date.now(); Object.keys(all).forEach(id=>d[id]=now); sySet('pg_dirty',d);
  SY.err=''; syRun().then(()=>{ toast(SY.err?'Collegamento non riuscito: '+SY.err:'Dispositivo collegato: dati allineati'); render(); });
}
function syDisconnect(){ SY.cfg=null; localStorage.removeItem('pg_sync'); localStorage.removeItem('pg_dirty'); localStorage.removeItem('pg_sbase'); localStorage.removeItem('pg_sync_t'); setSync('Salvato su questo dispositivo'); toast('Sincronizzazione scollegata: i dati restano su questo dispositivo'); render(); }
function syNewCode(){ const a=new Uint8Array(18); crypto.getRandomValues(a); return 'wb-'+Array.from(a,b=>b.toString(36).padStart(2,'0')).join('').slice(0,28); }
function syLink(){ const c=btoa(unescape(encodeURIComponent(JSON.stringify(SY.cfg)))); return location.origin+location.pathname+'#sync='+encodeURIComponent(c); }

const SY_SQL = `create table if not exists public.wb_docs (
  ws text not null, id text not null, data jsonb, u bigint not null default 0,
  deleted boolean not null default false, t timestamptz not null default now(),
  primary key (ws, id));
create index if not exists wb_docs_ws_t on public.wb_docs (ws, t);
create or replace function public.wb_touch() returns trigger language plpgsql as $$
begin
  if tg_op = 'UPDATE' and new.u < old.u then return null; end if;
  new.t := clock_timestamp(); return new;
end $$;
drop trigger if exists wb_touch on public.wb_docs;
create trigger wb_touch before insert or update on public.wb_docs for each row execute function public.wb_touch();
alter table public.wb_docs enable row level security;
drop policy if exists wb_ws on public.wb_docs;
create policy wb_ws on public.wb_docs for all to anon, authenticated
  using (ws = coalesce(current_setting('request.headers', true)::json->>'x-wb-ws', ''))
  with check (ws = coalesce(current_setting('request.headers', true)::json->>'x-wb-ws', ''));
grant select, insert, update on public.wb_docs to anon, authenticated;`;
