<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tyres Pressure</title>
<meta name="theme-color" content="#001533">
<meta name="description" content="Pressioni gomme a freddo per F4 Tatuus T-421 e BMW M4 GT4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700;1,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: muretto box in livrea team — fascia logo con barre inclinate, selezione, schede, vettura vista dall'alto.
   Unica veste scura (blu notte dei loghi), accento che cambia con il team: MPA azzurro/arancio, FS verde. */
:root{
  --bg:#001533; --surface:#07224a; --surface-2:#0d2d5c; --line:#1f4479;
  --fg:#f4f4f4; --muted:#9db3d3; --accent:#5bc4f1; --accent-2:#f2ad5c; --accent-ink:#001533;
  --ok:#3fd47c; --warn:#f2ad5c; --bad:#ff6b6b; --ok-bg:#0f3b2c; --warn-bg:#3b2f1b; --bad-bg:#3d1a24;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
body[data-team="fs"]{ --accent:#2ecf64; --accent-2:#ffffff; --accent-ink:#001533; }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
header{display:grid;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;min-height:56px}
.logo img{display:block;height:52px;width:auto;max-width:100%}
body[data-team="fs"] .logo img{height:64px}
.teamsw{display:flex;gap:4px}
.teamsw button{border:1px solid var(--line);background:transparent;color:var(--muted);font:italic 700 16px var(--f-display);letter-spacing:.06em;padding:6px 14px;cursor:pointer;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);min-height:36px}
.teamsw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.titlebar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:italic 800 34px/0.95 var(--f-display);letter-spacing:.01em;margin:0;text-transform:uppercase;text-wrap:balance}
h1 span{color:var(--accent)}
.stripes{display:flex;gap:6px;height:8px}
.stripes i{display:block;height:100%;transform:skewX(-28deg)}
.stripes i:nth-child(1){width:46px;background:var(--accent-2)}
.stripes i:nth-child(2){width:46px;background:var(--accent)}
.stripes i:nth-child(3){flex:1;background:var(--line)}
.sync{font-size:12px;color:var(--muted);font-family:var(--f-num)}
h2{font:italic 700 22px var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.sel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px;display:grid;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--bg);border-radius:4px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:0;background:transparent;color:var(--fg);font:600 14px var(--f-body);padding:8px 14px;cursor:pointer;min-height:38px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
select,input[type=text]{font:500 16px var(--f-num);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-height:40px;width:100%}
select{font-family:var(--f-body)}
input::placeholder{color:var(--muted);opacity:.8}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;color:var(--muted);font:italic 700 18px var(--f-display);text-transform:uppercase;letter-spacing:.04em;padding:8px 14px 10px;cursor:pointer;position:relative;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:4px;background:var(--accent);transform:skewX(-28deg)}
.panel{display:flex;flex-direction:column;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.car{display:grid;grid-template-columns:1fr 54px 1fr;grid-template-rows:auto auto;gap:10px;align-items:stretch}
.car .body{grid-column:2;grid-row:1/3;border:2px solid var(--line);border-radius:26px 26px 12px 12px;position:relative;background:linear-gradient(180deg,var(--surface-2),var(--surface))}
.car .body::before{content:"";position:absolute;left:50%;top:calc(10% + 6px);bottom:12%;width:4px;margin-left:-2px;background:var(--accent);border-radius:2px}
.car .body::after{content:"";position:absolute;left:50%;top:10%;width:18px;height:18px;margin-left:-9px;border-left:4px solid var(--accent);border-top:4px solid var(--accent);border-radius:2px 0 0 0;transform:rotate(45deg)}
.tyre{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tyre .t-h{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tyre .name{font:italic 700 16px var(--f-display);text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.big{font:600 32px/1 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big small{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}
.delta{font:500 12.5px var(--f-num);color:var(--muted)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini .field input{font-size:15px;min-height:36px;padding:6px 8px}
.chip{display:inline-block;font:600 11.5px var(--f-num);padding:2px 7px;border-radius:3px;background:var(--surface-2);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:9px 11px}
.note b{color:var(--fg)}
.btn{font:600 15px var(--f-body);border-radius:4px;padding:10px 18px;min-height:42px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);padding-inline:24px;border-radius:0}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.hist{display:flex;flex-direction:column;gap:8px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:grid;gap:6px}
.hcard .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;font:13px var(--f-num);font-variant-numeric:tabular-nums;width:100%}
th,td{padding:3px 6px;text-align:right;white-space:nowrap} th{color:var(--muted);font-weight:500;font-family:var(--f-body);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
td:first-child,th:first-child{text-align:left}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:10px 18px;font-weight:600;font-size:14px;z-index:20;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.muted{color:var(--muted)}
@media (max-width:420px){.car{grid-template-columns:1fr 22px 1fr}.car .body::after{width:12px;height:12px;margin-left:-6px;border-width:3px}.car .body::before{width:3px;margin-left:-1.5px}.big{font-size:27px}.logo img{height:40px}body[data-team="fs"] .logo img{height:52px}h1{font-size:29px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
const P0 = 1.013; // bar, pressione atmosferica
const C = ['AS','AD','PS','PD'];
const CN = {AS:'Ant. Sx',AD:'Ant. Dx',PS:'Post. Sx',PD:'Post. Dx'};
const CARS = {
  f4:  {name:'F4 Tatuus T-421', air:true,  def:{cold:[1.05,1.05,1.10,1.10], target:[1.40,1.40,1.43,1.43]}},
  gt4: {name:'BMW M4 GT4',      air:false, def:{cold:[1.45,1.45,1.40,1.40], target:[1.85,1.85,1.85,1.85]}}
};
// Base 20/20 dal foglio "TYRE PRESSURE" (MPA, Mugello)
// GT: dal foglio "TYRES PRESSURE" (GT Cup Europe, Barcellona)
const SEED_BASES = {
  'f4|Mugello':      {cold:[1.03,1.09,1.08,1.11], target:[1.40,1.40,1.43,1.43]},
  'gt4|Monza':       {cold:[1.28,1.38,1.21,1.28], target:[1.85,1.85,1.85,1.85]},
  'gt4|Spa-Francorchamps': {cold:[1.29,1.33,1.24,1.30], target:[1.85,1.85,1.85,1.85]},
  'gt4|Misano':      {cold:[1.25,1.29,1.18,1.24], target:[1.85,1.85,1.85,1.85]},
  'gt4|Paul Ricard': {cold:[1.30,1.36,1.21,1.31], target:[1.85,1.85,1.85,1.85]},
  'gt4|Barcellona':  {cold:[1.24,1.30,1.21,1.29], target:[1.85,1.85,1.85,1.85]}
};
// Coefficienti dai fogli: bar ogni +10 °C; rapporto caldo/freddo 1,5 F4, 2 GT
const DEF_COEF = {
  f4:  {kEnv:-0.0595, kRim:0.0595, ratio:1.5, mem:'avg3'},
  gt4: {kEnv:-0.05,   kRim:0.07,   ratio:2,   mem:'avg3'}
};
const CONDS = {dry:'Asciutta', damp:'Umida', wet:'Bagnata'};
const DEF_TRACKS = ['Monza','Imola','Mugello','Misano','Vallelunga','Paul Ricard','Spa-Francorchamps','Red Bull Ring','Barcellona','Hockenheim','Nürburgring','Zandvoort','Hungaroring'];
const TABS = {calc:'Calcolo', reg:'Registra run', hist:'Storico', base:'Base pista'};

let S = {
  car:'f4', track:'Mugello', cond:'dry', tab:'calc',
  sessions:[], bases:{}, prefs:{tracks:[], coef:{}},
  inp:{tt:20, ta:20, trim:[20,20,20,20], target:null},
  mode:'local', col:null
};

/* ---------- utilità ---------- */
const $ = s => document.querySelector(s);
const num = v => { const n = parseFloat(String(v).replace(',','.')); return isFinite(n) ? n : NaN; };
const f2 = n => isFinite(n) ? n.toFixed(2) : '–';
const f1 = n => isFinite(n) ? n.toFixed(1) : '–';
const sgn = n => (n>0?'+':'') + f2(n);
const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2200); }
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
const tracks = () => [...new Set([...DEF_TRACKS, ...(S.prefs.tracks||[])])];
const baseKey = (car,track) => 'base_'+car+'_'+slug(track);
function getBase(car=S.car, track=S.track){
  return S.bases[baseKey(car,track)] || (SEED_BASES[car+'|'+track] ? {...SEED_BASES[car+'|'+track], isSeed:true} : {...CARS[car].def, isDefault:true});
}
const coef = (car=S.car) => ({...DEF_COEF[car], ...((S.prefs.coef||{})[car]||{})});
const tol = d => Math.abs(d)<=0.02 ? 'ok' : Math.abs(d)<=0.05 ? 'warn' : 'bad';

/* ---------- modello (dal foglio TYRE PRESSURE) ----------
   Freddo = Base20/20 + (Tamb − 20)·kEnv/10 + (Tcerchio − 20)·kRim/10 − (TargetBase − NuovoTarget)/rapporto
   Tamb = media (T aria + T pista) per la F4, T pista per la GT4.
   Dopo un run: Freddo corretto = Freddo messo − (Caldo − Target)/rapporto,
   riportato a 20/20 e al target base: diventa la nuova Base 20/20 per quella pista e condizione.
*/
function history(car=S.car, track=S.track, cond=S.cond){
  return S.sessions.filter(s=>s.car===car && s.track===track && s.cond===cond).sort((a,b)=>b.date-a.date);
}
const tenvOf = (car,tt,ta) => CARS[car].air ? (tt+ta)/2 : tt;
const envCorr = (k,tenv,trim) => (tenv-20)*k.kEnv/10 + (trim-20)*k.kRim/10;

// Base 20/20 ricavata da un run, espressa al target base
function base20FromRun(s,i,b,k){
  const corrected = s.cold[i] - (s.hot[i]-s.target[i])/k.ratio;
  return corrected - envCorr(k, tenvOf(s.car,s.tt,s.ta??s.tt), s.trim[i]) + (b.target[i]-s.target[i])/k.ratio;
}
function learnedBase(){
  const b=getBase(), k=coef(), h=history().slice(0, k.mem==='last'?1:3);
  if(!h.length) return null;
  const w=[0.6,0.3,0.1].slice(0,h.length), sw=w.reduce((a,x)=>a+x,0);
  return {cold: C.map((_,i)=> h.reduce((a,s,j)=>a+w[j]*base20FromRun(s,i,b,k),0)/sw), n:h.length};
}
function recommend(){
  const b=getBase(), k=coef(), I=S.inp, L=learnedBase();
  const target = I.target || b.target;
  const tenv = tenvOf(S.car, I.tt, I.ta);
  return C.map((_,i)=>{
    const base20 = L ? L.cold[i] : b.cold[i];
    const cold = base20 + envCorr(k, tenv, I.trim[i]) - (b.target[i]-target[i])/k.ratio;
    return {cold, base:b.cold[i], base20, target:target[i], src:L?L.n:0};
  }).concat([{n:L?L.n:0, tenv}]);
}

/* ---------- persistenza ---------- */
function setSync(t){ $('#sync').textContent=t; }
async function persist(id, data){
  if(S.mode==='cloud'){
    try{ await S.col.doc(id).set(data); return true; }
    catch(e){ toast('Salvataggio non riuscito: '+(e.code||'errore')); return false; }
  }
  const all = lsGet('pg_docs',{}); all[id]=data; lsSet('pg_docs',all); ingest(all); return true;
}
async function remove(id){
  if(S.mode==='cloud'){ try{ await S.col.doc(id).delete(); }catch(e){ toast('Eliminazione non riuscita'); } return; }
  const all=lsGet('pg_docs',{}); delete all[id]; lsSet('pg_docs',all); ingest(all);
}
function ingest(docs){
  const ses=[], bases={}; let prefs=null;
  Object.entries(docs).forEach(([id,d])=>{
    if(!d) return;
    if(d.kind==='session') ses.push({...d, id});
    else if(d.kind==='base') bases[id]=d;
    else if(id==='prefs') prefs=d;
  });
  S.sessions=ses; S.bases=bases; if(prefs) S.prefs={...S.prefs, ...prefs};
  render();
}
async function initStore(){
  const use = window.claude && window.claude.use;
  let db=null, uid=null;
  if(use){ try{ const [u,d] = await Promise.all([use('user'), use('db')]); db=d; uid = u ? await u.id() : null; }catch(e){} }
  if(db && uid){
    S.mode='cloud'; S.col=db.collection('data/users/'+uid);
    setSync('Caricamento dati…');
    const timer=setTimeout(()=>setSync('Dati non ancora raggiungibili'),10000);
    S.col.onSnapshot(snap=>{
      if(!snap.metadata.fromCache){ clearTimeout(timer); setSync('Salvato nel tuo account'); }
      const docs={}; snap.docs.forEach(d=>docs[d.id]=d.data()); ingest(docs);
    }, e=>{ clearTimeout(timer); setSync('Archivio non disponibile'); });
  } else {
    S.mode='local'; setSync('Salvato su questo dispositivo'); ingest(lsGet('pg_docs',{}));
  }
}

/* ---------- interfaccia ---------- */
function renderSel(){
  $('#carSeg').innerHTML = Object.entries(CARS).map(([k,c])=>`<button type="button" data-car="${k}" aria-pressed="${S.car===k}">${c.name}</button>`).join('');
  $('#condSeg').innerHTML = Object.entries(CONDS).map(([k,c])=>`<button type="button" data-cond="${k}" aria-pressed="${S.cond===k}">${c}</button>`).join('');
  $('#trackSel').innerHTML = tracks().map(t=>`<option ${t===S.track?'selected':''}>${esc(t)}</option>`).join('');
  $('#tabs').innerHTML = Object.entries(TABS).map(([k,t])=>`<button type="button" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${t}</button>`).join('');
}
const inp = (id,val,extra='') => `<input type="text" inputmode="decimal" id="${id}" value="${isFinite(val)?val:''}" ${extra}>`;

function condInputs(prefix, I, air){
  return `<div class="grid3">
    <div class="field"><label class="lbl" for="${prefix}tt">T pista °C</label>${inp(prefix+'tt',I.tt)}</div>
    ${air?`<div class="field"><label class="lbl" for="${prefix}ta">T aria °C</label>${inp(prefix+'ta',I.ta)}</div>`:''}
    <div class="field"><label class="lbl" for="${prefix}trimAll">T cerchio freddo °C (tutte)</label>${inp(prefix+'trimAll','', 'placeholder="imposta 4"')}</div>
  </div>`;
}

function renderCalc(){
  const car=CARS[S.car], b=getBase(), I=S.inp; if(!I.target) I.target=[...b.target];
  const r=recommend(), meta=r.pop();
  const tyres = C.map((c,i)=>{
    const x=r[i], d=x.cold-x.base;
    return `<div class="tyre" style="grid-column:${i%2?3:1};grid-row:${i<2?1:2}">
      <div class="t-h"><span class="name">${CN[c]}</span><span class="chip">${x.src?x.src+' run':'base'}</span></div>
      <div class="big" id="out${i}">${f2(x.cold)}<small>bar</small></div>
      <div class="delta" id="dl${i}">base 20/20 ${f2(x.base20)}${x.src?` (pista ${f2(x.base)})`:''}</div>
      <div class="mini">
        <div class="field" style="grid-column:1/-1"><label class="lbl" for="trim${i}">Cerchio °C</label>${inp('trim'+i,I.trim[i])}</div>
      </div></div>`;
  }).join('');
  const k=coef();
  const amb = `${car.air?'media aria+pista':'T pista'} <span id="ambTxt">${f1(meta.tenv)}</span> °C`;
  const info = (meta.n
    ? `Base 20/20 aggiornata da ${meta.n===1?'l\'ultimo run':'una media pesata degli ultimi '+meta.n+' run'} su ${esc(S.track)} (${CONDS[S.cond].toLowerCase()}).`
    : `Nessun run registrato su ${esc(S.track)} in condizione ${CONDS[S.cond].toLowerCase()}: parto dalla Base 20/20 della pista.`)
    + ` Correzione per ${amb} (${sgn(k.kEnv)} bar/10 °C) e T cerchio (${sgn(k.kRim)} bar/10 °C), rapporto caldo/freddo ${f2(k.ratio)}.`;
  return `<div class="panel">
    <h2>Pressioni a freddo consigliate</h2>
    ${b.isDefault?`<div class="note">La base di ${esc(S.track)} usa valori di esempio. Inserisci i tuoi nella scheda <b>Base pista</b>.</div>`:''}
    ${b.isSeed?`<div class="note">Base 20/20 di ${esc(S.track)} presa dal tuo file ${S.car==='f4'?'MPA':'GT'}: target ${f2(b.target[0])} ant. / ${f2(b.target[2])} post.</div>`:''}
    ${condInputs('c', I, car.air)}
    <div class="grid3">
    <div class="field"><label class="lbl" for="cTgF">Target caldo anteriore</label>${inp('cTgF',I.target[0])}</div>
    <div class="field"><label class="lbl" for="cTgR">Target caldo posteriore</label>${inp('cTgR',I.target[2])}</div>
    </div>
    <div class="car">${tyres}<div class="body" aria-hidden="true"></div></div>
    <div class="note" id="calcInfo">${info}</div>
    <div class="row"><button class="btn primary" type="button" id="toReg">Copia valori nel Run</button>
    <button class="btn" type="button" id="toBase">Aggiorna Base 20/20 dai run</button></div>
  </div>`;
}
function updateCalcOutputs(){
  const r=recommend(), m=r.pop(); const a=$('#ambTxt'); if(a) a.textContent=f1(m.tenv);
  r.forEach((x,i)=>{ const o=$('#out'+i), d=$('#dl'+i); if(o){ o.innerHTML=`${f2(x.cold)}<small>bar</small>`; d.textContent=`base 20/20 ${f2(x.base20)}${x.src?` (pista ${f2(x.base)})`:''}`; } });}

let draft=null;
function renderReg(){
  const car=CARS[S.car];
  if(!draft || draft.car!==S.car || !draft.edited){
    const r=recommend(); r.pop();
    draft={car:S.car, tt:S.inp.tt, ta:S.inp.ta, trim:[...S.inp.trim], cold:r.map(x=>+x.cold.toFixed(2)), hot:[NaN,NaN,NaN,NaN], target:[...(S.inp.target||getBase().target)], note:''};
  }
  const D=draft;
  const tyres=C.map((c,i)=>`<div class="tyre" style="grid-column:${i%2?3:1};grid-row:${i<2?1:2}">
      <div class="t-h"><span class="name">${CN[c]}</span><span class="chip" id="er${i}">target ${f2(D.target[i])}</span></div>
      <div class="mini">
        <div class="field"><label class="lbl" for="rc${i}">Freddo bar</label>${inp('rc'+i,D.cold[i])}</div>
        <div class="field"><label class="lbl" for="rh${i}">Caldo bar</label>${inp('rh'+i,D.hot[i],'placeholder="misurato"')}</div>
        <div class="field" style="grid-column:1/-1"><label class="lbl" for="rt${i}">Cerchio °C</label>${inp('rt'+i,D.trim[i])}</div>
      </div></div>`).join('');
  return `<div class="panel">
    <h2>Registra run</h2>
    <div class="note">${esc(car.name)} · ${esc(S.track)} · ${CONDS[S.cond]}. Inserisci le pressioni a caldo misurate: il prossimo calcolo si correggerà da solo.</div>
    <div class="grid3">
      <div class="field"><label class="lbl" for="rtt">T pista °C</label>${inp('rtt',D.tt)}</div>
      ${car.air?`<div class="field"><label class="lbl" for="rta">T aria °C</label>${inp('rta',D.ta)}</div>`:''}
      <div class="field"><label class="lbl" for="rTgF">Target caldo anteriore</label>${inp('rTgF',D.target[0])}</div>
    <div class="field"><label class="lbl" for="rTgR">Target caldo posteriore</label>${inp('rTgR',D.target[2])}</div>
      <div class="field"><label class="lbl" for="rnote">Note</label><input type="text" id="rnote" value="${esc(D.note)}" placeholder="FP1, gomme nuove…" style="font-family:var(--f-body)"></div>
    </div>
    <div class="car">${tyres}<div class="body" aria-hidden="true"></div></div>
    <div class="row"><button class="btn primary" type="button" id="saveRun">Salva run</button><button class="btn" type="button" id="resetRun">Ricarica dai consigliati</button></div>
  </div>`;
}
function updateRegChips(){
  C.forEach((_,i)=>{ const el=$('#er'+i); if(!el) return; const h=draft.hot[i], t=draft.target[i];
    if(isFinite(h)){ const d=h-t; el.className='chip '+tol(d); el.textContent=`${sgn(d)} vs ${f2(t)}`; } else { el.className='chip'; el.textContent=`target ${f2(t)}`; } });
}

function renderHist(){
  const car=CARS[S.car];
  const all=S.sessions.filter(s=>s.car===S.car && s.track===S.track).sort((a,b)=>b.date-a.date);
  if(!all.length) return `<div class="panel"><h2>Storico</h2><div class="note">Nessun run salvato per ${esc(car.name)} a ${esc(S.track)}. Registra il primo dalla scheda <b>Registra run</b>.</div></div>`;
  return `<div class="panel"><h2>Storico · ${esc(S.track)}</h2><div class="hist">${all.map(s=>{
    const dt=new Date(s.date);
    return `<div class="hcard"><div class="top"><div><b>${dt.toLocaleDateString('it-IT')} ${dt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}</b> <span class="chip">${CONDS[s.cond]}</span> <span class="muted">${esc(s.note||'')}</span></div>
      <button class="btn sm danger" type="button" data-del="${s.id}">Elimina</button></div>
      <div class="muted" style="font-size:13px">T pista ${f1(s.tt)}°C${car.air?` · T aria ${f1(s.ta)}°C`:''}</div>
      <div class="tbl-wrap"><table><thead><tr><th></th>${C.map(c=>`<th>${CN[c]}</th>`).join('')}</tr></thead><tbody>
        <tr><td>Cerchio °C</td>${s.trim.map(v=>`<td>${f1(v)}</td>`).join('')}</tr>
        <tr><td>Freddo</td>${s.cold.map(v=>`<td>${f2(v)}</td>`).join('')}</tr>
        <tr><td>Caldo</td>${s.hot.map(v=>`<td>${f2(v)}</td>`).join('')}</tr>
        <tr><td>Scarto</td>${s.hot.map((v,i)=>{const d=v-s.target[i]; return `<td><span class="chip ${tol(d)}">${sgn(d)}</span></td>`;}).join('')}</tr>
      </tbody></table></div></div>`;}).join('')}</div></div>`;
}

function renderBase(){
  const car=CARS[S.car], b=getBase(), k=coef();
  return `<div class="panel"><h2>Base 20/20 · ${esc(S.track)}</h2>
    <div class="note">Pressioni a freddo con cerchio a 20 °C e ${car.air?'media aria+pista':'T pista'} a 20 °C che danno il target a caldo. Vale finché non registri run per la condizione scelta: da lì la base si aggiorna da sola.</div>
    <div class="tbl-wrap"><table><thead><tr><th></th>${C.map(c=>`<th>${CN[c]}</th>`).join('')}</tr></thead><tbody>
      <tr><td>Base 20/20 bar</td>${C.map((_,i)=>`<td>${inp('bc'+i,b.cold[i],'style="width:78px"')}</td>`).join('')}</tr>
    </tbody></table></div>
    <div class="grid3">
    <div class="field"><label class="lbl" for="bTgF">Target caldo anteriore</label>${inp('bTgF',b.target[0])}</div>
    <div class="field"><label class="lbl" for="bTgR">Target caldo posteriore</label>${inp('bTgR',b.target[2])}</div>
    </div>
    <div class="row"><button class="btn primary" type="button" id="saveBase">Salva base</button></div>
    <h2 style="margin-top:8px">Coefficienti · ${esc(car.name)}</h2>
    <div class="note">Valori di partenza dai tuoi fogli: ${sgn(DEF_COEF[S.car].kEnv)} bar ogni +10 °C di ${car.air?'media aria+pista':'T pista'}, ${sgn(DEF_COEF[S.car].kRim)} bar ogni +10 °C di cerchio, rapporto caldo/freddo ${f2(DEF_COEF[S.car].ratio)}.</div>
    <div class="grid3">
      <div class="field"><label class="lbl" for="kEnv">${car.air?'Aria+pista':'T pista'} bar/10 °C</label>${inp('kEnv',k.kEnv)}</div>
      <div class="field"><label class="lbl" for="kRim">Cerchio bar/10 °C</label>${inp('kRim',k.kRim)}</div>
      <div class="field"><label class="lbl" for="kRatio">Rapporto caldo/freddo</label>${inp('kRatio',k.ratio)}</div>
    </div>
    <div class="field"><div class="lbl">Aggiornamento base dai run</div><div class="seg" id="memSeg">
      <button type="button" data-mem="last" aria-pressed="${k.mem==='last'}">Solo ultimo run</button>
      <button type="button" data-mem="avg3" aria-pressed="${k.mem==='avg3'}">Media ultimi 3 (60/30/10)</button></div></div>
    <div class="row"><button class="btn" type="button" id="savePrefs">Salva coefficienti</button></div>
    <h2 style="margin-top:8px">Backup dati</h2>
    <div class="note">I dati restano su questo telefono. Esporta un backup dopo ogni evento: serve anche per passare run e basi su un altro dispositivo o a un collega.</div>
    <div class="row"><button class="btn" type="button" id="expData">Esporta backup</button>
    <label class="btn" for="impFile" style="display:inline-flex;align-items:center">Importa backup</label>
    <input type="file" id="impFile" accept=".json,application/json" hidden></div>
  </div>`;
}

function render(){
  renderSel();
  const v = {calc:renderCalc, reg:renderReg, hist:renderHist, base:renderBase}[S.tab]();
  $('#view').innerHTML=v;
  if(S.tab==='reg') updateRegChips();
}

/* ---------- eventi ---------- */
document.addEventListener('click', async e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.car){ S.car=t.dataset.car; S.inp.target=null; draft=null; render(); }
  else if(t.dataset.cond){ S.cond=t.dataset.cond; draft=null; render(); }
  else if(t.dataset.tab){ S.tab=t.dataset.tab; render(); }
  else if(t.id==='addTrack'){ const n=$('#newTrack').value.trim(); if(!n) return;
    if(!tracks().includes(n)){ S.prefs.tracks=[...(S.prefs.tracks||[]),n]; await persist('prefs',{...S.prefs, kind:'prefs'}); }
    S.track=n; S.inp.target=null; draft=null; render(); toast('Pista aggiunta'); }
  else if(t.id==='toReg'){ draft=null; S.tab='reg'; render(); window.scrollTo({top:0}); toast('Valori copiati: inserisci le pressioni a caldo'); }
  else if(t.id==='toBase'){ const L=learnedBase(); const b=getBase();
    if(!L){ toast('Registra almeno un run per aggiornare la base'); return; }
    const nb={kind:'base', car:S.car, track:S.track, cold:L.cold.map(v=>+v.toFixed(3)), target:[...b.target]};
    if(await persist(baseKey(S.car,S.track), nb)) toast('Base 20/20 aggiornata'); }
  else if(t.dataset.mem){ document.querySelectorAll('#memSeg button').forEach(x=>x.setAttribute('aria-pressed', x===t)); }
  else if(t.id==='resetRun'){ draft=null; render(); }
  else if(t.id==='saveRun'){
    const D=draft;
    const bad = [...D.cold,...D.hot,...D.trim,...D.target,D.tt].some(v=>!isFinite(v)) || (CARS[S.car].air && !isFinite(D.ta));
    if(bad){ toast('Compila tutti i valori, incluse le pressioni a caldo'); return; }
    const id='s_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const ok=await persist(id,{kind:'session', car:S.car, track:S.track, cond:S.cond, date:Date.now(), tt:D.tt, ta:CARS[S.car].air?D.ta:null, trim:D.trim, cold:D.cold, hot:D.hot, target:D.target, note:D.note});
    if(ok){ toast('Run salvato'); draft=null; S.inp.tt=D.tt; S.inp.ta=D.ta; S.tab='calc'; render(); }
  }
  else if(t.dataset.del){ if(t.dataset.armed){ await remove(t.dataset.del); toast('Run eliminato'); } else { t.dataset.armed='1'; t.textContent='Conferma'; } }
  else if(t.id==='saveBase'){
    const g=id=>num($('#'+id)?.value);
    const nb={kind:'base', car:S.car, track:S.track, cold:C.map((_,i)=>g('bc'+i)), target:[g('bTgF'),g('bTgF'),g('bTgR'),g('bTgR')]};
    if([...nb.cold,...nb.target].some(v=>!isFinite(v))){ toast('Controlla i valori: alcuni campi sono vuoti'); return; }
    if(await persist(baseKey(S.car,S.track),nb)){ S.inp.target=[...nb.target]; toast('Base salvata'); }
  }
  else if(t.id==='savePrefs'){
    const kEnv=num($('#kEnv').value), kRim=num($('#kRim').value), ratio=num($('#kRatio').value);
    const mem=document.querySelector('#memSeg button[aria-pressed="true"]')?.dataset.mem||'avg3';
    if(![kEnv,kRim,ratio].every(isFinite) || ratio<=0){ toast('Inserisci numeri validi; il rapporto deve essere maggiore di 0'); return; }
    S.prefs.coef={...(S.prefs.coef||{}), [S.car]:{kEnv,kRim,ratio,mem}};
    await persist('prefs',{...S.prefs, kind:'prefs'}); toast('Coefficienti salvati'); render(); }
});
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;

document.addEventListener('input', e=>{
  const id=e.target.id, v=num(e.target.value);
  if(S.tab==='calc'){
    if(id==='ctt') S.inp.tt=v; else if(id==='cta') S.inp.ta=v;
    else if(id==='ctrimAll'){ if(isFinite(v)){ S.inp.trim=[v,v,v,v]; C.forEach((_,i)=>{$('#trim'+i).value=v;}); } }
    else if(/^trim\d$/.test(id)) S.inp.trim[+id[4]]=v;
    else if(id==='cTgF'){ S.inp.target[0]=S.inp.target[1]=v; }
    else if(id==='cTgR'){ S.inp.target[2]=S.inp.target[3]=v; }
    else return;
    updateCalcOutputs();
  } else if(S.tab==='reg' && draft){
    draft.edited=true;
    if(id==='rtt') draft.tt=v; else if(id==='rta') draft.ta=v; else if(id==='rnote') draft.note=e.target.value;
    else if(id==='rTgF'){ draft.target[0]=draft.target[1]=v; }
    else if(id==='rTgR'){ draft.target[2]=draft.target[3]=v; }
    else if(/^r[cht]\d$/.test(id)){ const k={c:'cold',h:'hot',t:'trim',g:'target'}[id[1]]; draft[k][+id[2]]=v; }
    updateRegChips();
  }
});

function setTeam(t){ if(!LOGOS[t]) t='mpa'; document.body.dataset.team=t; const im=document.getElementById('logoImg'); im.src=LOGOS[t].src; im.alt=LOGOS[t].alt;
  document.querySelectorAll('.teamsw button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.team===t)); lsSet('pg_team',t); }
document.querySelector('.teamsw').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b){ e.stopPropagation(); setTeam(b.dataset.team); } });
setTeam(lsGet('pg_team','mpa'));

/* ---------- backup e installazione (versione app) ---------- */
document.addEventListener('click', e=>{
  if(e.target.id!=='expData') return;
  const data={app:'tyres-pressure', version:1, exported:new Date().toISOString(), docs:lsGet('pg_docs',{})};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='tyres-pressure-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('Backup esportato');
});
document.addEventListener('change', e=>{
  if(e.target.id!=='impFile' || !e.target.files[0]) return;
  const fr=new FileReader();
  fr.onload=()=>{ try{
      const d=JSON.parse(fr.result); if(!d.docs || typeof d.docs!=='object') throw 0;
      const all={...lsGet('pg_docs',{}), ...d.docs}; lsSet('pg_docs',all); ingest(all);
      toast('Backup importato: '+Object.values(d.docs).filter(x=>x&&x.kind==='session').length+' run');
    }catch(err){ toast('File non valido: scegli un backup di Tyres Pressure'); } };
  fr.readAsText(e.target.files[0]); e.target.value='';
});
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
render();
initStore();
</script>
